---

# Notified by the tasks that write to /tuxifier-sysroot; flushed at the end of post_minimal_install.yml.
- name: Relabel sysroot  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - chroot
      - /tuxifier-sysroot
      - /usr/sbin/fixfiles
      - -F
      - onboot
  when: '(ansible_tuxifier__strict_selinux | default(false) | bool) and not (ansible_tuxifier__continue_install | default(false) | bool)'
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell
