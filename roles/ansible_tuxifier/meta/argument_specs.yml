---
argument_specs:
  main:
    short_description: Partition disks and install a server from a dracut initramfs
    description:
      - "Partitions the selected installation disks."
      - "Creates filesystems and LVM logical volumes."
      - "Installs a minimal operating system from an initramfs built with dracut-incubator."
    author:
      - "Geert Geurts"
    options:
      tuxifier_reinstall:
        type: bool
        default: false
        description:
          - "Wipe the signatures of all disks in O(installdisk) before the storage layout is created."
          - "By default the layout is only made to match, so re-running the role changes nothing."
          - "Intended to be passed on the command line, for example V(-e tuxifier_reinstall=true)."
      installdisk_boot_disk:
        type: str
        description:
          - "The disk to install the boot loader on."
          - "Optional. Defaults to the disk of the partition pool with the volume mounted at /tuxifier-sysroot/boot, or else at /tuxifier-sysroot/boot/efi."
          - "The disk needs a partition pool, because the ESP or BIOS boot partition has to be a partition."
      installdisk:
        type: list
        elements: dict
        required: true
        description:
          - "The storage of the installation target, as a list of storage_pools of the linux-system-roles.storage role."
          - "Only pools of type partition and lvm are supported; the disks of a pool can be partitions or whole disks."
          - "Every disk in O(installdisk) is wiped when O(tuxifier_reinstall) is true."
          - "The pools are created in the order listed and mounted parent first (sorted by mount point), independent of the pool order; mount_point is given below /tuxifier-sysroot."
          - "WARNING: Existing storage on the specified disks is removed without confirmation."
        options:
          name:
            type: str
            required: true
            description:
              - "Name of the pool. For a partition pool the disk, for an lvm pool the volume group."
          type:
            type: str
            required: true
            choices:
              - partition
              - lvm
            description:
              - "Type of the pool."
          disks:
            type: list
            elements: str
            required: true
            description:
              - "Disks of the pool; for an lvm pool the partitions to use as physical volumes."
          volumes:
            type: list
            elements: dict
            required: true
            description:
              - "Volumes of the pool, as described for the storage role."

      installdistribution:
        type: dict
        required: true
        description:
          - "Describes the Linux distribution to install."
        options:
          name:
            type: str
            required: true
            description:
              - "Distribution name."
              - "Together with version, selects the corresponding file in the role vars directory for distribution specific variables."
          version:
            type: str
            required: true
            description:
              - "Distribution version."
              - "Together with name, selects the corresponding file in the role vars directory for distribution specific variables."
          repo:
            type: dict
            description:
              - "Optional override for the repository defined by the selected distribution vars file."
            options:
              type:
                type: str
                required: true
                choices:
                  - metalink
                  - mirrorlist
                  - baseurl
                description:
                  - "Type of repository URL."
              url:
                type: str
                required: true
                description:
                  - "URL of the metalink, mirrorlist or baseurl."

      rootpw:
        type: str
        required: true
        no_log: true
        description:
          - "Root password for the installed operating system."
          - "Store this value in Ansible Vault."

      root_authorized_keys:
        type: list
        elements: str
        description:
          - "SSH public keys added to the root user's authorized_keys file."
          - "These keys are added to the keys installed in the initramfs by dracut-sshd."

      strict_selinux:
        type: bool
        description:
          - "Whether SELinux is enabled for the installed system."
          - "Some distributions may require the first boot to use permissive mode."

      continue_install:
        type: bool
        description:
          - "Whether dracut continues its normal boot flow after the minimal installation."
          - "When false, the machine is powered off so the administrator can detach the initramfs."
          - "When true, the installed system must provide the same kernel version as the running initramfs."
