---
# defaults file for tuxifier role
ansible_tuxifier__continue_install: false
ansible_tuxifier__root_authorized_keys: []
ansible_tuxifier__reinstall: false # When true, wipe the signatures of all ansible_tuxifier__installdisk disks before the storage layout is created
ansible_tuxifier__crypttab_options: luks # The options field of the crypttab entries. The key field is always none: the passphrase is asked at boot
