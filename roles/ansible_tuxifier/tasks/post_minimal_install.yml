---

- name: Record installed kernel version == current kernel version
  block:
    - name: Stat vmlinuz
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot/boot/vmlinuz-' ~ ansible_facts['kernel'] }}"
      register: _vmlinuz
      changed_when: false

    - name: Set_fact current_version_installed
      ansible.builtin.set_fact:
        current_version_installed: "{{ _vmlinuz.stat.exists }}"
      changed_when: false

- name: Set root password
  block:
    - name: Read root shadow entry
      ansible.builtin.command:
        argv:
          - getent
          - shadow
          - root
      register: _root_shadow
      changed_when: false
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"

    - name: Set root password
      ansible.builtin.command:
        argv:
          - chpasswd
        stdin: "root:{{ rootpw }}"
      when: _root_shadow.stdout.split(':')[1] is match('^[!*]*$')
      no_log: true
      notify: Relabel sysroot
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"

- name: Read authorized_keys from initrd
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: _authorized_keys

- name: Add root authorized_keys to chroot
  block:
    - name: Create .ssh dir
      notify: Relabel sysroot
      ansible.builtin.file:
        path: /root/.ssh/
        state: directory
        mode: "0700"

    - name: Write authorized_keys
      notify: Relabel sysroot
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ item }}"
        create: true
        mode: "0600"
        owner: root
      loop: "{{ ((_authorized_keys['content'] | b64decode).splitlines() + root_authorized_keys) | select | unique }}"
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"

# The first partition pool with a volume at /boot, or else at /boot/efi.
- name: Set_fact boot_disk
  ansible.builtin.set_fact:
    boot_disk: >-
      {%- set ns = namespace(disks=[]) -%}
      {%- for mountpoint in ['/boot', '/boot/efi'] -%}
      {%- for pool in installdisk if pool.type == 'partition' -%}
      {%- for volume in pool.volumes | default([]) if (volume.mount_point | default('')) == mountpoint -%}
      {%- set ns.disks = ns.disks + [pool.name] -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ installdisk_boot_disk | default(ns.disks | first | default('')) }}

- name: Validate boot_disk
  ansible.builtin.assert:
    that:
      - boot_disk | length > 0
    fail_msg: >-
      boot_disk is not defined. The boot loader needs a partition pool with a volume mounted at /boot
      (or, if there is none, at /boot/efi). Alternatively set installdisk_boot_disk.

- name: Install grub2 to boot_disk for BIOS
  when: not efi_booted
  block:
    - name: Set_fact _biosboot_device
      ansible.builtin.set_fact:
        _biosboot_device: >-
          {%- set partitions = installdisk | selectattr('name', 'equalto', boot_disk) | map(attribute='volumes') | flatten
              | selectattr('fs_type', 'defined') | selectattr('fs_type', 'equalto', 'biosboot') | map(attribute='name') | list -%}
          {{ (boot_disk ~ ('p' if boot_disk[-1] is match('[0-9]') else '') ~ partitions[0]) if partitions | length > 0 else '' }}

    # The disk is read from the initramfs itself: entering the mount namespace of the sysroot is not needed
    # for that, and the nsenter of the namespaced shell fails here with rc 1, which is also the rc of "not found".
    # So "not installed" has its own rc (3), and any other rc than 0 or 3 fails the task.
    - name: Check if grub2 is installed to boot_disk for BIOS
      ansible.builtin.shell: |
        if dd if={{ boot_disk }} bs=440 count=1 2>/dev/null | grep -aq 'GRUB ' &&
           dd if={{ _biosboot_device or boot_disk }} bs=512 count=1 {{ 'skip=1' if not _biosboot_device else '' }} 2>/dev/null | grep -aq 'loading'
        then exit 0; else exit 3; fi
      register: _grub_bios_installed
      changed_when: false
      failed_when: _grub_bios_installed.rc not in [0, 3]
      vars:
        ansible_shell_executable: /bin/sh

    - name: Run grub2-install for BIOS
      ansible.builtin.command:
        argv:
          - grub2-install
          - --target
          - i386-pc
          - --recheck
          - "{{ boot_disk }}"
      when: _grub_bios_installed.rc == 3
      notify: Relabel sysroot
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"

- name: Install grub2 at efi
  when: efi_booted
  block:
    - name: Set_fact _esp_volume
      ansible.builtin.set_fact:
        _esp_volume: >-
          {{ installdisk | selectattr('name', 'equalto', boot_disk) | map(attribute='volumes') | flatten
             | selectattr('fs_type', 'defined') | selectattr('fs_type', 'equalto', 'efi') | first }}

    # The ESP is mounted at this point: ask the mounts of the namespace for its PARTUUID
    - name: Read the PARTUUID of the ESP
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --first-only
          - --output
          - PARTUUID
          - --mountpoint
          - "/tuxifier-sysroot{{ _esp_volume.mount_point }}"
      register: _esp_findmnt
      changed_when: false

    - name: Assert the ESP is mounted
      ansible.builtin.assert:
        that: _esp_findmnt.stdout | trim != ''
        fail_msg: "No device found mounted at /tuxifier-sysroot{{ _esp_volume.mount_point }}"

    - name: Set_fact _esp_partuuid
      ansible.builtin.set_fact:
        _esp_partuuid: "{{ _esp_findmnt.stdout | trim | lower }}"

    - name: Read existing EFI boot entries
      ansible.builtin.command:
        argv:
          - efibootmgr
          - -v
      register: efibootmgr_entries
      changed_when: false
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"

    - name: Set_fact _efi_entries, _efi_bootorder and _efi_label
      ansible.builtin.set_fact:
        _efi_entries: "{{ efibootmgr_entries.stdout_lines | select('search', _esp_partuuid) | list }}"
        _efi_bootorder: >-
          {{ efibootmgr_entries.stdout_lines | select('match', '^BootOrder:') | first | default('')
             | regex_replace('^BootOrder:\s*', '') | split(',') }}
        _efi_label: "{{ distribution.name | capitalize }}"

    - name: Set_fact _efi_bootnr and _efi_loader
      ansible.builtin.set_fact:
        _efi_bootnr: "{{ _efi_entry | regex_replace('^Boot([0-9A-Fa-f]{4}).*', '\\1') }}"
        _efi_loader: "{{ (_efi_entry | regex_search(distribution.efi_entry_regex, '\\1') | default([''], true) | first) | regex_replace('\\\\', '/') }}"
      vars:
        _efi_entry: "{{ _efi_entries | first | default('') }}"

    - name: Stat efiloader
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot' ~ _esp_volume.mount_point ~ _efi_loader }}"
      register: _stat_efiloader

    - name: Remove and install efi entries
      when: (_efi_entries | length != 1) or (not _stat_efiloader.stat.exists) or (_efi_bootnr not in _efi_bootorder)
      block:
        - name: Remove existing efi entries
          ansible.builtin.command:
            argv:
              - efibootmgr
              - --delete-bootnum
              - -b
              - "{{ item }}"
          loop: >-
            {{ efibootmgr_entries.stdout_lines
               | select('match', '^Boot[0-9A-Fa-f]{4}\*? +' ~ _efi_label ~ '\s')
               | map('regex_replace', '^Boot([0-9A-Fa-f]{4}).*', '\1') | list }}

        - name: Install grub2 at efi
          ansible.builtin.command:
            argv:
              - efibootmgr
              - --remove-dups
              - --create
              - --disk
              - "{{ boot_disk }}"
              - --part
              - "{{ _esp_volume.name }}"
              - --label
              - "{{ _efi_label }}"
              - --loader
              - '\EFI\{{ distribution.efi_vendor_dir }}\{{ distribution.efi_loader }}'
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"
# The grub.cfg on the ESP is a stub that points to distribution.grub_cfg; it is left untouched.
- name: Generate grub config in a temporary file
  ansible.builtin.command:
    cmd: "/usr/sbin/grub2-mkconfig -o /tmp/grub.cfg"
  changed_when: false
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"

- name: Install grub config when it differs
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: /tuxifier-sysroot/tmp/grub.cfg
    dest: "/tuxifier-sysroot{{ distribution.grub_cfg }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Remove temporary grub config
  ansible.builtin.file:
    path: /tuxifier-sysroot/tmp/grub.cfg
    state: absent
  changed_when: false

- name: Discover host keys from initrd
  ansible.builtin.find:
    path: "/etc/ssh/"
    patterns:
      - 'ssh_host_*_key'
      - 'ssh_host_*_key.pub'
  register: etc_ssh

- name: Install ssh host keys
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: "{{ '0644' if item.endswith('.pub') else '0600' }}"
  loop: "{{ etc_ssh.files | map(attribute='path') | list }}"

- name: Relabel /tuxifier-sysroot when something changed
  ansible.builtin.meta: flush_handlers
