---

- name: Record installed kernel version == current kernel version
  block:
    - name: Stat vmlinuz
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot/boot/vmlinuz-' ~ ansible_facts['kernel'] }}"
      register: __vmlinuz

    - name: Set_fact ansible_tuxifier__current_version_installed
      ansible.builtin.set_fact:
        ansible_tuxifier__current_version_installed: "{{ __vmlinuz.stat.exists }}"

- name: Set root password
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"
  block:
    - name: Read root shadow entry
      ansible.builtin.command:
        argv:
          - getent
          - shadow
          - root
      register: __root_shadow
      changed_when: false

    - name: Set root password  # noqa: no-changed-when
      ansible.builtin.command:
        argv:
          - chpasswd
        stdin: "root:{{ ansible_tuxifier__rootpw }}"
      when: __root_shadow.stdout.split(':')[1] is match('^[!*]*$')
      no_log: true
      notify: Relabel sysroot

- name: Read authorized_keys from initrd
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: __authorized_keys

- name: Add root authorized_keys to chroot
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"
  block:
    - name: Create .ssh dir
      notify: Relabel sysroot
      ansible.builtin.file:
        path: /root/.ssh/
        state: directory
        mode: "0700"

    - name: Write authorized_keys
      notify: Relabel sysroot
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ item }}"
        create: true
        mode: "0600"
        owner: root
      loop: "{{ ((__authorized_keys['content'] | b64decode).splitlines() + ansible_tuxifier__root_authorized_keys) | select | unique }}"

# Version 8 has no python3.12 (its python3 is 3.6, too old for the ansible modules), which the playbook needs to continue on the installed system. The first boot
# installs it: atd runs a job that is already due when it starts.
- name: Install python3.12 on the first boot of the installed system
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"
  when: ansible_tuxifier__distribution.version == '8' and __continue_install
  block:
    - name: Stat python3.12
      ansible.builtin.stat:
        path: /usr/bin/python3.12
      register: __python3

    - name: Enable atd
      ansible.builtin.systemd:
        name: atd
        enabled: true
      notify: Relabel sysroot

    - name: List the queued at jobs
      ansible.builtin.command:
        argv:
          - atq
      register: __atq
      changed_when: false

    - name: Queue the python3.12 install  # noqa: no-changed-when
      when: not __python3.stat.exists and __atq.stdout | trim == ''
      ansible.builtin.command:
        argv:
          - at
          - now
        stdin: "until dnf install -y python3.12; do sleep 10; done"
      notify: Relabel sysroot

# The first partition pool with a volume at /boot, or else at /boot/efi.
- name: Set_fact __boot_disk
  ansible.builtin.set_fact:
    __boot_disk: >-
      {%- set ns = namespace(disks=[]) -%}
      {%- for mountpoint in ['/boot', '/boot/efi'] -%}
      {%- for pool in ansible_tuxifier__installdisk if pool.type == 'partition' -%}
      {%- for volume in pool.volumes | default([]) if (volume.mount_point | default('')) == mountpoint -%}
      {%- set ns.disks = ns.disks + [pool.name] -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ansible_tuxifier__installdisk_boot_disk | default(ns.disks | first | default('')) }}

- name: Validate __boot_disk
  ansible.builtin.assert:
    that:
      - __boot_disk | length > 0
    fail_msg: >-
      __boot_disk is not defined. The boot loader needs a partition pool with a volume mounted at /boot
      (or, if there is none, at /boot/efi). Alternatively set ansible_tuxifier__installdisk_boot_disk.

- name: Install grub2 to __boot_disk for BIOS
  when: not ansible_tuxifier__efi_booted
  block:
    - name: Set_fact __biosboot_device
      ansible.builtin.set_fact:
        __biosboot_device: >-
          {%- set partitions = ansible_tuxifier__installdisk | selectattr('name', 'equalto', __boot_disk) | map(attribute='volumes') | flatten
              | selectattr('fs_type', 'defined') | selectattr('fs_type', 'equalto', 'biosboot') | map(attribute='name') | list -%}
          {{ (__boot_disk ~ ('p' if __boot_disk[-1] is match('[0-9]') else '') ~ partitions[0]) if partitions | length > 0 else '' }}

    # The disk is read from the initramfs itself: entering the mount namespace of the sysroot is not needed
    # for that, and the nsenter of the namespaced shell fails here with rc 1, which is also the rc of "not found".
    # So "not installed" has its own rc (3), and any other rc than 0 or 3 fails the task.
    - name: Check if grub2 is installed to __boot_disk for BIOS
      ansible.builtin.shell: |
        set -o pipefail
        if dd if={{ __boot_disk }} bs=440 count=1 2>/dev/null | grep -aq 'GRUB ' &&
           dd if={{ __biosboot_device or __boot_disk }} bs=512 count=1 {{ 'skip=1' if not __biosboot_device else '' }} 2>/dev/null | grep -aq 'loading'
        then exit 0; else exit 3; fi
      register: __grub_bios_installed
      changed_when: false
      failed_when: __grub_bios_installed.rc not in [0, 3]
      vars:
        ansible_shell_executable: /bin/sh

    - name: Run grub2-install for BIOS  # noqa: no-changed-when
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"
      ansible.builtin.command:
        argv:
          - grub2-install
          - --target
          - i386-pc
          - --recheck
          - "{{ __boot_disk }}"
      when: __grub_bios_installed.rc == 3
      notify: Relabel sysroot

- name: Install grub2 at efi
  when: ansible_tuxifier__efi_booted
  block:
    - name: Set_fact __esp_volume
      ansible.builtin.set_fact:
        __esp_volume: >-
          {{ ansible_tuxifier__installdisk | selectattr('name', 'equalto', __boot_disk) | map(attribute='volumes') | flatten
             | selectattr('fs_type', 'defined') | selectattr('fs_type', 'equalto', 'efi') | first }}

    # The ESP is mounted at this point: ask the mounts of the namespace for its PARTUUID
    - name: Read the PARTUUID of the ESP
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --first-only
          - --output
          - PARTUUID
          - --mountpoint
          - "/tuxifier-sysroot{{ __esp_volume.mount_point }}"
      register: __esp_findmnt
      changed_when: false

    - name: Assert the ESP is mounted
      ansible.builtin.assert:
        that: __esp_findmnt.stdout | trim != ''
        fail_msg: "No device found mounted at /tuxifier-sysroot{{ __esp_volume.mount_point }}"

    - name: Set_fact __esp_partuuid
      ansible.builtin.set_fact:
        __esp_partuuid: "{{ __esp_findmnt.stdout | trim | lower }}"

    - name: Read existing EFI boot entries
      ansible.builtin.command:
        argv:
          - efibootmgr
          - -v
      register: __efibootmgr_entries
      changed_when: false
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"

    - name: Set_fact __efi_entries, __efi_bootorder and __efi_label
      ansible.builtin.set_fact:
        __efi_entries: "{{ __efibootmgr_entries.stdout_lines | select('search', __esp_partuuid) | list }}"
        __efi_bootorder: >-
          {{ __efibootmgr_entries.stdout_lines | select('match', '^BootOrder:') | first | default('')
             | regex_replace('^BootOrder:\s*', '') | split(',') }}
        __efi_label: "{{ ansible_tuxifier__distribution.name | capitalize }}"

    - name: Set_fact __efi_bootnr and __efi_loader
      ansible.builtin.set_fact:
        __efi_bootnr: "{{ __efi_entry | regex_replace('^Boot([0-9A-Fa-f]{4}).*', '\\1') }}"
        __efi_loader: "{{ (__efi_entry | regex_search(ansible_tuxifier__distribution.efi_entry_regex, '\\1') | default([''], true) | first) | regex_replace('\\\\', '/') }}"
      vars:
        __efi_entry: "{{ __efi_entries | first | default('') }}"

    - name: Stat efiloader
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot' ~ __esp_volume.mount_point ~ __efi_loader }}"
      register: __stat_efiloader

    - name: Remove and install efi entries
      vars:
        ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
        ansible_python_interpreter: "{{ python_interpreter }}"
      when: (__efi_entries | length != 1) or (not __stat_efiloader.stat.exists) or (__efi_bootnr not in __efi_bootorder)
      block:
        - name: Remove existing efi entries  # noqa: no-changed-when
          ansible.builtin.command:
            argv:
              - efibootmgr
              - --delete-bootnum
              - -b
              - "{{ item }}"
          loop: >-
            {{ __efibootmgr_entries.stdout_lines
               | select('match', '^Boot[0-9A-Fa-f]{4}\*? +' ~ __efi_label ~ '\s')
               | map('regex_replace', '^Boot([0-9A-Fa-f]{4}).*', '\1') | list }}

        - name: Install grub2 at efi  # noqa: no-changed-when
          ansible.builtin.command:
            argv:
              - efibootmgr
              - --remove-dups
              - --create
              - --disk
              - "{{ __boot_disk }}"
              - --part
              - "{{ __esp_volume.name }}"
              - --label
              - "{{ __efi_label }}"
              - --loader
              - '\EFI\{{ ansible_tuxifier__distribution.efi_vendor_dir }}\{{ ansible_tuxifier__distribution.efi_loader }}'
# On RHEL 8 the grub.cfg on the ESP is the full config; elsewhere it is a stub
# that points to ansible_tuxifier__distribution.grub_cfg, which must be left untouched on the ESP.
- name: Set_fact __grub_cfg_path
  ansible.builtin.set_fact:
    __grub_cfg_path: >-
      {{ '/boot/efi/EFI/' ~ ansible_tuxifier__distribution.efi_vendor_dir ~ '/grub.cfg'
         if (ansible_tuxifier__efi_booted and ansible_tuxifier__distribution.grub_cfg_full_on_esp | default(false) | bool)
         else ansible_tuxifier__distribution.grub_cfg }}
  changed_when: false

- name: Generate grub config in a temporary file
  ansible.builtin.command:
    cmd: "/usr/sbin/grub2-mkconfig -o /tmp/grub.cfg"
  changed_when: false
  vars:
    ansible_shell_executable: /tmp/namespaced-chrooted-ansible-shell
    ansible_python_interpreter: "{{ python_interpreter }}"

- name: Install grub config when it differs
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: /tuxifier-sysroot/tmp/grub.cfg
    dest: "/tuxifier-sysroot{{ __grub_cfg_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Remove temporary grub config
  ansible.builtin.file:
    path: /tuxifier-sysroot/tmp/grub.cfg
    state: absent
  changed_when: false

- name: Discover host keys from initrd
  ansible.builtin.find:
    path: "/etc/ssh/"
    patterns:
      - 'ssh_host_*_key'
      - 'ssh_host_*_key.pub'
  register: __etc_ssh

- name: Install ssh host keys
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: "{{ '0644' if item.endswith('.pub') else '0600' }}"
  loop: "{{ __etc_ssh.files | map(attribute='path') | list }}"

- name: Relabel /tuxifier-sysroot when something changed
  ansible.builtin.meta: flush_handlers
