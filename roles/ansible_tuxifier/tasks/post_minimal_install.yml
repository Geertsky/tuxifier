---

- name: Find a Python in the chroot that ansible supports
  ansible.builtin.command:
    argv:
      - chroot
      - /tuxifier-sysroot
      - sh
      - -c
      - |
        for python in /usr/bin/python3 \
                      $(ls /usr/bin/python3.[0-9] /usr/bin/python3.[0-9][0-9] 2>/dev/null | sort -rV) \
                      /usr/libexec/platform-python /usr/bin/python; do
          if "$python" -c "import sys; sys.exit(sys.version_info < (3, 9))" 2>/dev/null; then
            echo "$python"
            exit 0
          fi
        done
  register: _chroot_python
  changed_when: false
  failed_when: false

- name: Bind mount python-nest in the chroot
  when: _chroot_python.stdout | trim == ''
  block:
    - name: Create the python-nest mountpoint in the chroot
      ansible.builtin.file:
        path: /tuxifier-sysroot/local/conda/envs/python-nest
        state: directory
        mode: '0755'

    - name: Bind mount python-nest
      ansible.posix.mount:
        path: /tuxifier-sysroot/local/conda/envs/python-nest
        src: /local/conda/envs/python-nest
        fstype: none
        opts: bind,ro
        state: ephemeral

- name: Set_fact python_interpreter
  ansible.builtin.set_fact:
    python_interpreter: "{{ (_chroot_python.stdout | trim) or '/local/conda/envs/python-nest/bin/python3' }}"
  changed_when: false


- name: Record installed kernel version == current kernel version
  block:
    - name: Stat vmlinuz
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot/boot/vmlinuz-' ~ ansible_facts['kernel'] }}"
      register: _vmlinuz
      changed_when: false

    - name: Set_fact current_version_installed
      ansible.builtin.set_fact:
        current_version_installed: "{{ _vmlinuz.stat.exists }}"
      changed_when: false

# chpasswd hashes with the method of the installed system (login.defs/PAM). The
# password is only set while root has none, as chpasswd uses a new salt on every
# run and the installation has no update path.
- name: Read root shadow entry
  ansible.builtin.command:
    argv: [chroot, /tuxifier-sysroot, getent, shadow, root]
  register: _root_shadow
  changed_when: false

- name: Set root password
  ansible.builtin.command:
    argv: [chroot, /tuxifier-sysroot, chpasswd]
    stdin: "root:{{ rootpw }}"
  when: _root_shadow.stdout.split(':')[1] is match('^[!*]*$')
  no_log: true
  notify: Relabel sysroot

- name: Add root authorized_keys to chroot
  block:
    - name: Read authorized_keys
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: _authorized_keys

    - name: Set_fact authorized_keys
      ansible.builtin.set_fact:
        authorized_keys: "{{ _authorized_keys['content'] | b64decode | split('\n') | reject('equalto', '') }}"

    - name: Create .ssh dir
      notify: Relabel sysroot
      ansible.builtin.file:
        path: /tuxifier-sysroot/root/.ssh/
        state: directory
        mode: "0700"

    - name: Write authorized_keys
      notify: Relabel sysroot
      ansible.builtin.lineinfile:
        path: /tuxifier-sysroot/root/.ssh/authorized_keys
        line: "{{ item }}"
        create: true
        mode: "0600"
        owner: root
      loop: "{{ (authorized_keys + root_authorized_keys) | unique | reject('equalto', '') }}"

- name: Detect EFI
  block:
    - name: Stat /sys/firmware/efi
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: _efi
      changed_when: false

    - name: Set_fact grub_target
      ansible.builtin.set_fact:
        grub_target: "{% if _efi.stat.exists %}x86_64-efi{% else %}i386-pc{% endif %}"
      changed_when: false

# The boot loader goes on the disk with the /boot partition or, when /boot is
# not a partition, on the disk with the ESP (/boot/efi).
- name: Set_fact _boot_disk_candidates
  ansible.builtin.set_fact:
    _boot_disk_candidates: >-
      {%- set ns = namespace(disks=[]) -%}
      {%- for mountpoint in ['/boot', '/boot/efi'] -%}
      {%- for pool in installdisk if pool.type == 'partition' -%}
      {%- for volume in pool.volumes | default([]) if (volume.mount_point | default('')) == mountpoint -%}
      {%- set ns.disks = ns.disks + [pool.name] -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.disks }}
  changed_when: false

- name: Set_fact boot_disk
  ansible.builtin.set_fact:
    boot_disk: "{{ installdisk_boot_disk | default(_boot_disk_candidates | first | default('')) }}"
  changed_when: false

- name: Validate boot_disk
  ansible.builtin.assert:
    that:
      - boot_disk | default('', true) | string | trim != ''
    fail_msg: >-
      boot_disk is not defined. The boot loader needs a partition pool with a volume mounted at /boot
      (or, if there is none, at /boot/efi). Alternatively set installdisk_boot_disk.

# grub2-install is not idempotent. It is run when the boot code is missing: the
# text of boot.img in the MBR of boot_disk, or the text of diskboot.img, the start
# of core.img, in the bios_grub partition (GPT) or in sector 1 (msdos).
- name: Install grub2 to boot_disk for BIOS
  when: grub_target == "i386-pc"
  block:
    - name: Set_fact _biosboot_device
      ansible.builtin.set_fact:
        _biosboot_device: >-
          {%- set partitions = installdisk | selectattr('name', 'equalto', boot_disk) | map(attribute='volumes') | flatten
              | selectattr('fs_type', 'defined') | selectattr('fs_type', 'equalto', 'biosboot') | map(attribute='name') | list -%}
          {{ (boot_disk ~ ('p' if boot_disk[-1] is match('[0-9]') else '') ~ partitions[0]) if partitions | length > 0 else '' }}
      changed_when: false

    # The result of a pipeline is the result of grep; a missing device gives no input, so grep fails.
    - name: Check if grub2 is installed to boot_disk for BIOS
      ansible.builtin.shell: |
        dd if={{ boot_disk }} bs=440 count=1 2>/dev/null | grep -aq 'GRUB ' &&
        dd if={{ _biosboot_device if _biosboot_device else boot_disk }} bs=512 count=1 {{ '' if _biosboot_device else 'skip=1' }} 2>/dev/null | grep -aq 'loading'
      register: _grub_bios_installed
      changed_when: false
      failed_when: _grub_bios_installed.rc > 1

    - name: Run grub2-install for BIOS
      ansible.builtin.command:
        cmd: "chroot /tuxifier-sysroot grub2-install --target=i386-pc --recheck {{ boot_disk }}"
      when: _grub_bios_installed.rc == 1
      notify: Relabel sysroot

- name: Install grub2 at efi
  when: grub_target == "x86_64-efi"
  block:
    - name: Set_fact efi partitionnr
      ansible.builtin.set_fact:
        efi_partitionnr: >-
          {{
          installdisk
          | selectattr('name', 'equalto', boot_disk)
          | map(attribute='volumes')
          | flatten
          | selectattr('fs_type', 'equalto', 'efi')
          | map(attribute='name')
          | first
          }}
      changed_when: false

    - name: Set_fact efi_mountpoint
      ansible.builtin.set_fact:
        efi_mountpoint: >-
          {{ installdisk | map(attribute='volumes') | flatten
             | selectattr('fs_type', 'defined')
             | selectattr('fs_type', 'equalto', 'efi')
             | map(attribute='mount_point') | first }}
      changed_when: false

    # The ESP is mounted at this point: take its device from the mounts of the namespace
    - name: Read the mounts of the namespace
      ansible.builtin.slurp:
        src: /proc/self/mountinfo
      register: _mountinfo

    # mountinfo: <id> <parent> <major:minor> <root> <mountpoint> <opts> [optional...] - <fstype> <source> <superopts>
    - name: Set_fact _esp_device
      ansible.builtin.set_fact:
        _esp_device: >-
          {{ (_mountinfo.content | b64decode).splitlines()
             | map('regex_search', '^\S+ \S+ \S+ \S+ ' ~ (('/tuxifier-sysroot' ~ efi_mountpoint) | regex_escape) ~ ' .* - \S+ (\S+) ', '\1')
             | select | map('first') | list | last | default('') }}
      changed_when: false

    - name: Assert the ESP is mounted
      ansible.builtin.assert:
        that: _esp_device is match('^/dev/')
        fail_msg: "No device found mounted at /tuxifier-sysroot{{ efi_mountpoint }}"

    # -p probes the device itself, so no dependency on the udev database
    - name: Read PARTUUID of the ESP
      ansible.builtin.command:
        cmd: "blkid -p -s PART_ENTRY_UUID -o value {{ _esp_device }}"
      register: _esp_blkid
      changed_when: false

    - name: Set_fact _esp_partuuid
      ansible.builtin.set_fact:
        _esp_partuuid: "{{ _esp_blkid.stdout | trim | lower }}"
      changed_when: false

    - name: Set_fact _efibootmgr
      ansible.builtin.set_fact:
        _efibootmgr: "{{ efibootmgr | default('/usr/sbin/efibootmgr') }}"
      changed_when: false

    - name: Read existing EFI boot entries
      ansible.builtin.command: "chroot /tuxifier-sysroot {{ _efibootmgr }} -v"
      register: efibootmgr_entries
      changed_when: false

    - name: Set_fact entries and bootorder
      ansible.builtin.set_fact:
        entries: "{{ efibootmgr_entries.stdout_lines | select('search', _esp_partuuid) | list }}"
        bootorder: >-
          {{ efibootmgr_entries.stdout_lines | select('match', '^BootOrder:') | first | default('')
             | regex_replace('^BootOrder:\s*', '') | split(',') }}
      changed_when: false

    - name: Set_fact bootnr efiloader
      ansible.builtin.set_fact:
        bootnr: "{{ (entries | first | default('')) | regex_replace('^Boot([0-9A-Fa-f]{4}).*', '\\1') }}"
        efiloader: "{{ (entries | first | default('')) | regex_replace('.*File\\((.*)\\).*', '\\1') | regex_replace('\\\\', '/') if entries | length > 0 else '' }}"
      changed_when: false

    - name: Stat efiloader
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot' ~ efi_mountpoint ~ efiloader }}"
      register: _stat_efiloader

    - name: Remove an install efi entries
      when: (entries | length != 1) or (not _stat_efiloader.stat.exists) or (bootnr not in bootorder)
      block:
        - name: Remove existing efi entries
          ansible.builtin.command:
            argv:
              - chroot
              - /tuxifier-sysroot
              - "{{ _efibootmgr }}"
              - --delete-bootnum
              - -b
              - "{{ item }}"
          loop: >-
            {{ efibootmgr_entries.stdout_lines
               | select('match', '^Boot[0-9A-Fa-f]{4}\*? +' ~ (installdistribution.name | capitalize) ~ '\s')
               | map('regex_replace', '^Boot([0-9A-Fa-f]{4}).*', '\1') | list }}

        - name: Install grub2 at efi
          ansible.builtin.command: >
            chroot /tuxifier-sysroot {{ _efibootmgr }} --remove-dups --create --disk {{ boot_disk }}
            --part {{ efi_partitionnr }}
            --label {{ installdistribution.name | capitalize }}
            --loader '\EFI\{{ distribution.efi_vendor_dir }}\{{ distribution.efi_loader }}'

# On RHEL 8 the grub.cfg on the ESP is the full config; elsewhere it is a stub
# that points to distribution.grub_cfg, which must be left untouched on the ESP.
- name: Set_fact grub_cfg_path
  ansible.builtin.set_fact:
    grub_cfg_path: >-
      {{ '/boot/efi/EFI/' ~ distribution.efi_vendor_dir ~ '/grub.cfg'
         if (grub_target == 'x86_64-efi' and distribution.grub_cfg_full_on_esp | bool)
         else distribution.grub_cfg }}
  changed_when: false

- name: Generate grub config in a temporary file
  ansible.builtin.command:
    cmd: "chroot /tuxifier-sysroot /usr/sbin/grub2-mkconfig -o /tmp/grub.cfg"
  changed_when: false

- name: Install grub config when it differs
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: /tuxifier-sysroot/tmp/grub.cfg
    dest: "/tuxifier-sysroot{{ grub_cfg_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Remove temporary grub config
  ansible.builtin.file:
    path: /tuxifier-sysroot/tmp/grub.cfg
    state: absent
  changed_when: false

- name: Discover host keys
  ansible.builtin.find:
    path: "/etc/ssh/"
  register: etc_ssh
  changed_when: false

- name: Set_fact ssh_keys and ssh_pubs
  ansible.builtin.set_fact:
    ssh_keys: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*key$') }}"
    ssh_pubs: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*pub$') }}"
  changed_when: false

- name: Install ssh host keys
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: '0600'
  loop: "{{ ssh_keys }}"

- name: Install ssh host pub keys
  notify: Relabel sysroot
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: '0644'
  loop: "{{ ssh_pubs }}"

# The initramfs has no SELinux policy loaded, so everything that is installed or
# rewritten here has no label. The tasks that change files in /tuxifier-sysroot
# notify "Relabel sysroot", which only runs when one of them changed something.
- name: Relabel /tuxifier-sysroot when something changed
  ansible.builtin.meta: flush_handlers
