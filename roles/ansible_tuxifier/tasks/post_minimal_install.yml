---

- name: Record installed kernel version == current kernel version
  block:
    - name: Stat vmlinuz
      ansible.builtin.stat:
        path: "{{ '/tuxifier-sysroot/boot/vmlinuz-' ~ ansible_facts['kernel'] }}"
      register: _vmlinuz
      changed_when: false

    - name: Set_fact current_version_installed
      ansible.builtin.set_fact:
        current_version_installed: "{{ _vmlinuz.stat.exists }}"
      changed_when: false

# Idempotent without changing the hash method of the distribution: the password
# is verified against the hash in /etc/shadow with the libcrypt of the installed
# system (any method it supports) and only set, by chpasswd with the defaults of
# the distribution, when it does not match.
- name: Read root shadow entry
  ansible.builtin.command: chroot /tuxifier-sysroot getent shadow root
  register: _root_shadow
  changed_when: false
  failed_when: false
  no_log: true

- name: Check root password
  ansible.builtin.command:
    argv:
      - chroot
      - /tuxifier-sysroot
      - python3
      - -c
      - |
        import ctypes, ctypes.util, sys
        lib = ctypes.CDLL(ctypes.util.find_library("crypt") or "libcrypt.so.1")
        lib.crypt.restype = ctypes.c_char_p
        lib.crypt.argtypes = [ctypes.c_char_p, ctypes.c_char_p]
        current = sys.argv[1].encode()
        sys.exit(0 if current and lib.crypt(sys.stdin.read().rstrip("\n").encode(), current) == current else 1)
      - "{{ _root_shadow.stdout.split(':')[1] if _root_shadow.rc == 0 else '' }}"
    stdin: "{{ rootpw }}"
  register: _root_pw_check
  changed_when: false
  failed_when: _root_pw_check.rc not in [0, 1]
  no_log: true

- name: Set root password
  ansible.builtin.command:
    argv: [chroot, /tuxifier-sysroot, chpasswd]
    stdin: "root:{{ rootpw }}"
  when: _root_pw_check.rc == 1
  no_log: true

- name: Add root authorized_keys to chroot
  block:
    - name: Read authorized_keys
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: _authorized_keys

    - name: Set_fact authorized_keys
      ansible.builtin.set_fact:
        authorized_keys: "{{ _authorized_keys['content'] | b64decode | split('\n') | reject('equalto', '') }}"

    - name: Create .ssh dir
      ansible.builtin.file:
        path: /tuxifier-sysroot/root/.ssh/
        state: directory
        mode: "0700"

    - name: Write authorized_keys
      ansible.builtin.lineinfile:
        path: /tuxifier-sysroot/root/.ssh/authorized_keys
        line: "{{ item }}"
        create: true
        mode: "0600"
        owner: root
      loop: "{{ (authorized_keys + root_authorized_keys) | unique | reject('equalto', '') }}"

- name: Detect EFI
  block:
    - name: Stat /sys/firmware/efi
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: _efi
      changed_when: false

    - name: Set_fact grub_target
      ansible.builtin.set_fact:
        grub_target: "{% if _efi.stat.exists %}x86_64-efi{% else %}i386-pc{% endif %}"
      changed_when: false

# The boot loader goes on the disk with the /boot partition or, when /boot is
# not a partition, on the disk with the ESP (/boot/efi).
- name: Set_fact _boot_disk_candidates
  ansible.builtin.set_fact:
    _boot_disk_candidates: >-
      {%- set ns = namespace(disks=[]) -%}
      {%- for mountpoint in ['/boot', '/boot/efi'] -%}
      {%- for pool in installdisk if pool.type == 'partition' -%}
      {%- for volume in pool.volumes | default([]) if (volume.mount_point | default('')) == mountpoint -%}
      {%- set ns.disks = ns.disks + [pool.name] -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.disks }}
  changed_when: false

- name: Set_fact boot_disk
  ansible.builtin.set_fact:
    boot_disk: "{{ installdisk_boot_disk | default(_boot_disk_candidates | first | default('')) }}"
  changed_when: false

- name: Validate boot_disk
  ansible.builtin.assert:
    that:
      - boot_disk | default('', true) | string | trim != ''
    fail_msg: >-
      boot_disk is not defined. The boot loader needs a partition pool with a volume mounted at /boot
      (or, if there is none, at /boot/efi). Alternatively set installdisk_boot_disk.

- name: Install grub2 to boot_disk for BIOS
  when: grub_target == "i386-pc"
  ansible.builtin.command:
    cmd: "chroot /tuxifier-sysroot grub2-install --target=i386-pc --recheck {{ boot_disk }}"

- name: Install grub2 at efi
  when: grub_target == "x86_64-efi"
  block:
    - name: Set_fact efi partitionnr
      ansible.builtin.set_fact:
        efi_partitionnr: >-
          {{
          installdisk
          | selectattr('name', 'equalto', boot_disk)
          | map(attribute='volumes')
          | flatten
          | selectattr('fs_type', 'equalto', 'efi')
          | map(attribute='name')
          | first
          }}
      changed_when: false

    - name: Set_fact _efibootmgr
      ansible.builtin.set_fact:
        _efibootmgr: "{{ efibootmgr | default('/usr/sbin/efibootmgr') }}"
      changed_when: false

    - name: Read existing EFI boot entries
      ansible.builtin.command: "chroot /tuxifier-sysroot {{ _efibootmgr }}"
      register: efibootmgr_entries
      changed_when: false

    - name: GGDefault
      ansible.builtin.debug:
        var: efibootmgr_entries

    - name: Remove existing efi entries
      ansible.builtin.command:
        argv:
          - chroot
          - /tuxifier-sysroot
          - "{{ _efibootmgr }}"
          - --delete-bootnum
          - -b
          - "{{ item }}"
      loop: "{{ efibootmgr_entries.stdout_lines | select('match', '.*' ~ (installdistribution.name | capitalize) ) | map('replace', 'Boot', '') | map('replace', '* ' ~ (installdistribution.name | capitalize),'')}}"

    - name: Install grub2 at efi
      ansible.builtin.command: >
        chroot /tuxifier-sysroot {{ _efibootmgr }} --remove-dups --create --disk {{ boot_disk }}
        --part {{ efi_partitionnr }}
        --label {{ installdistribution.name | capitalize }}
        --loader '\EFI\{{ installdistribution.name }}\shimx64.efi'

    - name: Install grub2 at /boot/efi/EFI/<distribution.name>/grub.cfg for RHEL8
      when: distribution.version == "8"
      ansible.builtin.command:
        cmd: "chroot /tuxifier-sysroot /usr/sbin/grub2-mkconfig -o /boot/efi/EFI/{{ distribution.name }}/grub.cfg"
      register: finalize__grub2_mkconfig
      failed_when: finalize__grub2_mkconfig.rc != 0

- name: Install grub2 /boot/grub2/grub.cfg
  ansible.builtin.command:
    cmd: "chroot /tuxifier-sysroot /usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg"
  register: finalize__grub2_mkconfig
  failed_when: finalize__grub2_mkconfig.rc != 0

- name: Discover host keys
  ansible.builtin.find:
    path: "/etc/ssh/"
  register: etc_ssh
  changed_when: false

- name: Set_fact ssh_keys and ssh_pubs
  ansible.builtin.set_fact:
    ssh_keys: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*key$') }}"
    ssh_pubs: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*pub$') }}"
  changed_when: false

- name: Install ssh host keys
  when:
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: '0600'
  loop: "{{ ssh_keys }}"

- name: Install ssh host pub keys
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tuxifier-sysroot/etc/ssh/
    remote_src: true
    mode: '0644'
  loop: "{{ ssh_pubs }}"
  changed_when: false

- name: Relabel /bambini-sysroot
  ansible.builtin.command:
    cmd: chroot /tuxifier-sysroot /usr/sbin/fixfiles -F onboot
  when: '(strict_selinux | default(false) | bool) and not (continue_install | default(false) | bool)'
