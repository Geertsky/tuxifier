---

# Mounts what the chroot needs besides the filesystems of the storage layout, which the storage role has mounted already.
# Included with ansible_shell_executable: /tmp/namespaced-ansible-shell, so that the mounts end up in the namespace of
# /tuxifier-sysroot.
# TEMPORARY, see check_or_create_storage_layout.yml. The mount point does not exist in the freshly mounted /boot.
- name: Create the mount point of the ESP
  ansible.builtin.file:
    path: "/tuxifier-sysroot{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ _efi_mounts }}"
  changed_when: false

- name: Mount the ESP
  ansible.posix.mount:
    path: "/tuxifier-sysroot{{ item.path }}"
    src: "{{ item.src }}"
    fstype: vfat
    state: ephemeral
  loop: "{{ _efi_mounts }}"
  changed_when: false

- name: Mkdirs /dev /sys and /proc
  notify: Relabel sysroot
  ansible.builtin.file:
    path: "/tuxifier-sysroot{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/dev"
    - "/proc"
    - "/sys"

- name: Mount all virtual_filesystems
  ansible.posix.mount:
    path: "{{ '/tuxifier-sysroot' ~ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.src }}"
    opts: "{{ item.opts }}"
    state: ephemeral
  loop: "{{ virtual_filesystems }}"
  changed_when: false

- name: Create the python-nest mountpoint in the chroot
  ansible.builtin.file:
    path: /tuxifier-sysroot/local/conda/envs/python-nest
    state: directory
    mode: '0755'
  changed_when: false

- name: Bind mount python-nest in the chroot
  ansible.posix.mount:
    path: /tuxifier-sysroot/local/conda/envs/python-nest
    src: /local/conda/envs/python-nest
    fstype: none
    opts: bind,ro
    state: ephemeral
  changed_when: false
