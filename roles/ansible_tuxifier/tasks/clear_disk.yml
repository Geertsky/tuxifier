---

# The disks of the partition pools first, then the other disks that are not a partition of one of those.
- name: Set the install disks
  ansible.builtin.set_fact:
    ansible_tuxifier__installdisk_disks: >-
      {{ __partition_disks + (ansible_tuxifier__installdisk | map(attribute='disks') | flatten | reject('match', __partition_regex) | unique | list) }}
  vars:
    __partition_disks: "{{ ansible_tuxifier__installdisk | selectattr('type', 'equalto', 'partition') | map(attribute='disks') | flatten | unique }}"
    __partition_regex: '({{ __partition_disks | map("regex_escape") | join("|") }})(p?[0-9]+|-part[0-9]+)?$'

# Layers can be stacked in any order (LUKS on a logical volume, a volume group on LUKS or on md RAID),
# so peel them off until nothing changes anymore.
- name: Tear down the existing LUKS devices, volume groups and md RAID arrays
  ansible.builtin.shell: |
    for pass in 1 2 3 4; do
      for dm in /sys/block/dm-*; do
        case "$(cat $dm/dm/uuid 2>/dev/null)" in CRYPT-LUKS*) cryptsetup close "$(cat $dm/dm/name)" ;; esac
      done
      for VG in $(lvm vgs --noheadings -o vg_name); do
        lvm lvchange --activate n $VG;
      done
      mdadm --stop --scan
    done
    exit 0
  register: __clean_installdisk_vgscript
  changed_when: false

- name: Zero MBR  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - wipefs
      - -af
      - "{{ item }}"
  loop: "{{ ansible_tuxifier__installdisk_disks }}"

- name: Reload partitions  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - blockdev
      - --rereadpt
      - "{{ item }}"
  loop: "{{ ansible_tuxifier__installdisk_disks }}"

- name: Update message
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installdisk destroyed
    mode: "0644"
  changed_when: false
