---

- name: Copy a /certs/ca-bundle.trust.crt
  ansible.builtin.copy:
    src: etc/ssl/certs/ca-bundle.crt
    dest: /etc/pki/tls/certs/
    mode: '0644'
  changed_when: false

- name: Stat /etc
  ansible.builtin.stat:
    path: /tuxifier-sysroot/etc
  register: _stat_etc

- name: Create /etc
  notify: Relabel sysroot
  when: not _stat_etc.stat.exists
  ansible.builtin.file:
    path: /tuxifier-sysroot/etc
    state: directory
    mode: '0755'

- name: Write the fstab entries of the block device filesystems
  notify: Relabel sysroot
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts }}"
    dump: "{{ item.dump }}"
    passno: "{{ item.passno }}"
    fstab: /tuxifier-sysroot/etc/fstab
    state: present
  loop: "{{ _sysroot_volumes }}"

- name: Stat /dev /sys and /proc
  ansible.builtin.stat:
    path: "/tuxifier-sysroot{{ item }}"
  loop:
    - "/dev"
    - "/proc"
    - "/sys"
  register: _dev_proc_sys

- name: Mkdirs /dev /sys and /proc
  notify: Relabel sysroot
  ansible.builtin.file:
    path: "/tuxifier-sysroot{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ _dev_proc_sys.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: Mount all virtual_filesystems
  ansible.posix.mount:
    path: "{{ '/tuxifier-sysroot' ~ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.src }}"
    opts: "{{ item.opts }}"
    state: ephemeral
  loop: "{{ virtual_filesystems }}"
  changed_when: false

- name: Stat resolv.conf
  ansible.builtin.stat:
    path: /tuxifier-sysroot/etc/resolv.conf
  register: _etc_resolv_conf

- name: Copy resolv.conf to chroot
  notify: Relabel sysroot
  when: not _etc_resolv_conf.stat.exists
  ansible.builtin.copy:
    remote_src: true
    src: /etc/resolv.conf
    dest: /tuxifier-sysroot/etc/
    mode: '0644'
