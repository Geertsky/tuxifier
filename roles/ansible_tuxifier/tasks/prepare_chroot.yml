---

- name: "Copy a /certs/ca-bundle.trust.crt"
  ansible.builtin.copy:
    src: etc/ssl/certs/ca-bundle.crt
    dest: /etc/pki/tls/certs/
    mode: '0644'

- name: "Install genfstab"
  ansible.builtin.copy:
    src: files/genfstab
    dest: /tmp/genfstab
    mode: '0755'

- name: "Generate /etc/fstab"
  ansible.builtin.command:
    cmd: /tmp/genfstab -f /tuxifier-sysroot -L /tuxifier-sysroot
  register: prepare_chroot__fstab
  failed_when: prepare_chroot__fstab.rc != 0

- name: "Create /etc"
  ansible.builtin.file:
    path: /tuxifier-sysroot/etc
    state: directory
    mode: '0755'

- name: "Write /etc/fstab"
  ansible.builtin.copy:
    content: "{{ prepare_chroot__fstab.stdout_lines | join('\n') }}\n"
    dest: /tuxifier-sysroot/etc/fstab
    mode: '0644'

- name: "Mkdirs /dev /sys and /proc"
  ansible.builtin.file:
    path: "/tuxifier-sysroot{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/dev"
    - "/proc"
    - "/sys"

- name: See if we're boot with efi
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: _efi

- name: Determine virtual_filesystems to mount
  ansible.builtin.set_fact:
    virtual_filesystems_to_mount: >-
      {{
        virtual_filesystems
        if _efi.stat.exists
        else virtual_filesystems
        | rejectattr('src', 'equalto', 'efivarfs')
        | list
      }}

- name: Mount all virtual_filesystems
  ansible.posix.mount:
    path: "{{ '/tuxifier-sysroot' ~ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.src }}"
    opts: "{{ item.opts }}"
    state: ephemeral
  loop: "{{ virtual_filesystems_to_mount }}"

- name: "Copy resolv.conf to chroot"
  ansible.builtin.copy:
    remote_src: true
    src: /etc/resolv.conf
    dest: /tuxifier-sysroot/etc/
    mode: '0644'
