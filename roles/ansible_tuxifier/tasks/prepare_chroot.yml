---

- name: Copy a /certs/ca-bundle.trust.crt
  ansible.builtin.copy:
    src: etc/ssl/certs/ca-bundle.crt
    dest: /etc/pki/tls/certs/
    mode: '0644'
  changed_when: false

- name: Stat /etc
  ansible.builtin.stat:
    path: /tuxifier-sysroot/etc
  register: _stat_etc

- name: Create /etc
  notify: Relabel sysroot
  when: not _stat_etc.stat.exists
  ansible.builtin.file:
    path: /tuxifier-sysroot/etc
    state: directory
    mode: '0755'

# The storage role has written the filesystems to the /etc/fstab of the initramfs, with the mount points below
# /tuxifier-sysroot (swap has none). The installed system gets that file without the prefix.
- name: Read the fstab written by the storage role
  ansible.builtin.slurp:
    src: /etc/fstab
  register: _fstab

- name: Write the fstab of the installed system
  notify: Relabel sysroot
  ansible.builtin.copy:
    dest: /tuxifier-sysroot/etc/fstab
    content: "{{ _fstab.content | b64decode | regex_replace('(?m)^(\\S+\\s+)/tuxifier-sysroot/?(\\S*)', '\\1/\\2') ~ (_esp_fstab_lines | default('', true)) }}"
    mode: '0644'
  vars:
    # TEMPORARY, see check_or_create_storage_layout.yml: the storage role did not write the ESP to the fstab.
    # Empty without an ESP, which Ansible turns into None: default('', true) above keeps that out of the fstab.
    _esp_fstab_lines: |-
      {% for mount in _efi_mounts %}
      {{ mount.src }} {{ mount.path }} vfat defaults 0 2
      {% endfor %}

- name: Stat resolv.conf
  ansible.builtin.stat:
    path: /tuxifier-sysroot/etc/resolv.conf
  register: _etc_resolv_conf

- name: Copy resolv.conf to chroot
  notify: Relabel sysroot
  when: not _etc_resolv_conf.stat.exists
  ansible.builtin.copy:
    remote_src: true
    src: /etc/resolv.conf
    dest: /tuxifier-sysroot/etc/
    mode: '0644'
