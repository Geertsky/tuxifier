---

- name: Make /tuxifier-sysroot a private namespace
  ansible.builtin.shell: |
    mkdir -p /root/namespaces
    mountpoint -q /root/namespaces || {
      mount --bind /root/namespaces /root/namespaces &&
      mount --make-private /root/namespaces
    }
    [ -e /root/namespaces/tuxifier-sysroot ] || touch /root/namespaces/tuxifier-sysroot
    mountpoint -q /root/namespaces/tuxifier-sysroot ||
      unshare --mount=/root/namespaces/tuxifier-sysroot sh -c 'sleep 1'
  changed_when: false

- name: Create /tuxifier-sysroot mountpoint
  ansible.builtin.file:
    path: "/tuxifier-sysroot"
    state: directory
    mode: "0755"
  changed_when: false

# The initramfs does not assemble md RAID arrays. Without them the storage role does not see the volume groups on
# them and creates the arrays again, which destroys their data. Only the member disks of the install layout are
# assembled; a disk that is no member, or an array that is running already, is not an error.
- name: Assemble the existing md RAID arrays of the install layout
  ansible.builtin.command:
    argv:
      - mdadm
      - --incremental
      - "{{ item }}"
  loop: "{{ installdisk | selectattr('raid_level', 'defined') | map(attribute='disks') | flatten | unique | list }}"
  when: not (tuxifier_reinstall | bool)
  register: _mdadm_incremental
  changed_when: false
  failed_when:
    - _mdadm_incremental.rc != 0
    - "'no recognisable superblock' not in _mdadm_incremental.stderr"
    - "'Device or resource busy' not in _mdadm_incremental.stderr"

# The arrays and their volume groups exist now, and the swap usage has to be known to switch it off below.
- name: Refresh the device and swap facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - hardware

- name: Activate the existing volume groups of the install layout
  community.general.lvg:
    vg: "{{ item }}"
    state: active
  loop: "{{ installdisk | selectattr('type', 'equalto', 'lvm') | map(attribute='name') | list }}"
  when:
    - not (tuxifier_reinstall | bool)
    - item in (ansible_facts['lvm']['vgs'] | default({}))
  changed_when: false

- name: Make certain swap is not active
  when: ansible_facts['swaptotal_mb'] > 0
  ansible.builtin.command:
    argv:
      - swapoff
      - --all
  changed_when: false

- name: Create the storage
  ansible.builtin.include_role:
    name: linux-system-roles.storage
  vars:
    storage_safe_mode: false
    storage_skip_checks:
      - blivet_available
      - packages_installed
      - cryptsetup_services
    # The storage role mounts the filesystems and writes them to the /etc/fstab of the initramfs. The mount points
    # are seen from the installed system, so they are prepended with /tuxifier-sysroot here; / becomes /tuxifier-sysroot.
    storage_pools: >-
      {%- set ns = namespace(disks=[]) -%}
      {%- for disk in installdisk -%}
        {%- set vols = namespace(items=[]) -%}
        {%- for vol in disk.volumes | default([]) -%}
          {%- if vol.fs_type | default('') == 'efi' -%}
            {%- set vols.items = vols.items + [vol | dict2items | rejectattr('key', 'equalto', 'mount_point') | items2dict] -%}
          {%- elif vol.mount_point | default('') -%}
            {%- set vols.items = vols.items + [vol | combine({'mount_point': '/tuxifier-sysroot' ~ ('' if vol.mount_point == '/' else vol.mount_point)})] -%}
          {%- else -%}
            {%- set vols.items = vols.items + [vol] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set ns.disks = ns.disks + [disk | combine({'volumes': vols.items})] -%}
      {%- endfor -%}
      {{ ns.disks }}
    storage_volumes: []
    ansible_shell_executable: /tmp/namespaced-ansible-shell

# TEMPORARY, until linux-system-roles.storage mounts an efi volume as vfat (branch fix-efi-mount-type, commit 1d7dd78):
# the storage role has created the ESP but does not mount it, so it is mounted here and gets its fstab entry in
# prepare_chroot.yml. Revert the commit that adds this when the fix is merged and requirements.yml points to it.
- name: Set_fact _efi_mounts
  ansible.builtin.set_fact:
    _efi_mounts: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for pool in installdisk -%}
      {%- set bpool = _storage_pools_list | selectattr('name', 'equalto', pool.name) | first -%}
      {%- for vol in pool.volumes | default([]) if (vol.fs_type | default('')) == 'efi' and (vol.mount_point | default('')) -%}
      {%- set bvol = bpool.volumes | selectattr('name', 'equalto', vol.name) | first -%}
      {%- set ns.items = ns.items + [{'path': vol.mount_point, 'src': bvol._mount_id}] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Mount the virtual filesystems and python-nest in /tuxifier-sysroot
  ansible.builtin.include_tasks: mount_tuxifier_sysroot.yml
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Update message
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installdisk partitioned and mounted
    mode: "0644"
  changed_when: false
