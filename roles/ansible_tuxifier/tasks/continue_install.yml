---

- name: Poweroff
  when: not current_version_installed or not continue_install
  block:
    - name: Shutdown
      ansible.builtin.copy:
        dest: /usr/lib/dracut/hooks/pre-pivot/999-shutdown.sh
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl poweroff
      changed_when: false

    - name: "Trigger continuation of boot process"
      ansible.builtin.file:
        path: "/tmp/ansible-finished"
        state: touch
        mode: '0644'
      changed_when: false

    - name: End play
      ansible.builtin.meta: end_host
      changed_when: false

- name: Continue install
  when: continue_install is defined and continue_install and current_version_installed
  block:
    - name: "Trigger continuation of boot process"
      ansible.builtin.file:
        path: "/tmp/ansible-finished"
        state: touch
        mode: '0644'
      changed_when: false

    - name: Clear gathered facts from all currently targeted hosts
      ansible.builtin.meta: clear_facts
      changed_when: false
