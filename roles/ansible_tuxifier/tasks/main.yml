---

- name: Gather_facts
  ansible.builtin.setup:

- name: Create message file
  ansible.builtin.file:
    path: /tmp/message
    state: touch
    mode: "0644"
  changed_when: false

- name: Set the install distribution vars
  ansible.builtin.include_vars: "{{ installdistribution['name'] ~ installdistribution['version'] }}.yml"

- name: Set the install disks
  ansible.builtin.set_fact:
    installdisk_disks: >-
      {{ _partition_disks +
         (installdisk | map(attribute='disks') | flatten | unique
          | reject('match', '^(' ~ (_partition_disks | map('regex_escape') | join('|')) ~ ')(p?[0-9]+|-part[0-9]+)$')
          | difference(_partition_disks) | list) }}
  vars:
    _partition_disks: "{{ installdisk | selectattr('type', 'equalto', 'partition') | map(attribute='disks') | flatten | unique | list }}"

- name: Clear install disk
  ansible.builtin.import_tasks: clear_disk.yml
  when: tuxifier_reinstall | bool

- name: Deploy namespaced ansible_shell_wrapper
  ansible.builtin.copy:
    src: namespaced-ansible-shell
    dest: /tmp/
    mode: "0755"
    owner: root
    group: root
  changed_when: false

- name: Check/create storage layout
  ansible.builtin.import_tasks: check_or_create_storage_layout.yml

- name: Prepare chroot
  ansible.builtin.import_tasks: prepare_chroot.yml
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Update message
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installing...
    mode: "0644"
  changed_when: false

- name: Minimal Install
  ansible.builtin.import_tasks: minimal_install.yml
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Post Minimal Install
  ansible.builtin.import_tasks: post_minimal_install.yml
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Update message
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installation finished
    mode: "0644"
  changed_when: false

- name: Umount /tuxifier-sysroot
  ansible.builtin.command:
    cmd: umount -R -A /tuxifier-sysroot
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell
  changed_when: false

- name: Umount /root/namespaces
  ansible.builtin.command:
    cmd: umount /root/namespaces/tuxifier-sysroot
  changed_when: false

- name: Umount /root/namespaces
  ansible.builtin.command:
    cmd: umount /root/namespaces
  changed_when: false

- name: Continue install
  ansible.builtin.import_tasks: continue_install.yml
