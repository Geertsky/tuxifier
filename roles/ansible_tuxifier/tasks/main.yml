---

- name: Gather_facts
  ansible.builtin.setup:

- name: See if we're boot with efi
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: _efi
  changed_when: false

- name: Set_fact efi_booted
  ansible.builtin.set_fact:
    efi_booted: "{{ _efi.stat.exists }}"

- name: Create message file
  ansible.builtin.file:
    path: /tmp/message
    state: touch
    mode: "0644"
  changed_when: false

- name: Set the install distribution vars
  ansible.builtin.include_vars: "{{ installdistribution['name'] ~ installdistribution['version'] }}.yml"

- name: Clear install disk
  ansible.builtin.import_tasks: clear_disk.yml
  when: tuxifier_reinstall | bool

- name: Deploy namespaced ansible_shell_wrapper
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/
    mode: "0755"
    owner: root
    group: root
  changed_when: false
  loop:
    - namespaced-chrooted-ansible-shell
    - namespaced-ansible-shell

- name: Check/create storage layout
  ansible.builtin.import_tasks: check_or_create_storage_layout.yml

# Everything in the namespace of /tuxifier-sysroot.
- name: Install into /tuxifier-sysroot
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell
  block:
    - name: Prepare chroot
      ansible.builtin.import_tasks: prepare_chroot.yml

    - name: Prepare the storage configuration of the installed system
      ansible.builtin.import_tasks: prepare_storage_config.yml

    - name: Update message
      ansible.builtin.copy:
        dest: /tmp/message
        content: Installing...
        mode: "0644"
      changed_when: false

    - name: Minimal Install
      ansible.builtin.import_tasks: minimal_install.yml

    - name: Post Minimal Install
      ansible.builtin.import_tasks: post_minimal_install.yml

    - name: Update message
      ansible.builtin.copy:
        dest: /tmp/message
        content: Installation finished
        mode: "0644"
      changed_when: false

    - name: Unmount python-nest from the chroot
      ansible.posix.mount:
        path: /tuxifier-sysroot/local/conda/envs/python-nest
        state: unmounted
      changed_when: false

    - name: Remove /local/conda from the chroot
      ansible.builtin.file:
        path: /tuxifier-sysroot/local/conda
        state: absent
      changed_when: false

    - name: Umount /tuxifier-sysroot
      ansible.builtin.command:
        argv:
          - umount
          - -R
          - -A
          - /tuxifier-sysroot
      changed_when: false

- name: Umount /root/namespacesi/tuxifier-sysroot
  ansible.posix.mount:
    path: /root/namespaces/tuxifier-sysroot
    state: unmounted
  changed_when: false

- name: Umount /root/namespaces
  ansible.posix.mount:
    path: /root/namespaces
    state: unmounted
  changed_when: false

- name: Continue install
  ansible.builtin.import_tasks: continue_install.yml
