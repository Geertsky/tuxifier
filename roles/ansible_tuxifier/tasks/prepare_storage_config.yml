---

# Runs before minimal_install.yml: the kernel package builds the initramfs of the
# installed system when it is installed, so the files below have to be in place by then.

# The devices of the install layout exist by now, refresh the facts to see them.
- name: Refresh the device facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - hardware

# An opened LUKS mapping has the dm uuid CRYPT-LUKS<version>-<luks uuid without dashes>-<name>.
# An md array has the links md-name-<host>:<name> and md-uuid-<uuid>, one of each per array.
- name: Find the LUKS devices and md RAID arrays of the install layout
  ansible.builtin.set_fact:
    _luks_ids: "{{ _device_ids | select('match', 'dm-uuid-CRYPT-LUKS') | list }}"
    _md_names: "{{ _device_ids | select('match', 'md-name-') | list }}"
    _md_uuids: "{{ _device_ids | select('match', 'md-uuid-') | list }}"
  vars:
    _device_ids: "{{ ansible_facts['devices'].values() | map(attribute='links.ids') | flatten }}"

- name: Write the crypttab of the installed system
  when: _luks_ids | length > 0
  notify: Relabel sysroot
  ansible.builtin.copy:
    dest: /tuxifier-sysroot/etc/crypttab
    content: |
      {% for id in _luks_ids %}
      {{ id | regex_replace(_luks_regex, '\6') }} UUID={{ id | regex_replace(_luks_regex, '\1-\2-\3-\4-\5') }} none {{ tuxifier_crypttab_options }}
      {% endfor %}
    mode: '0600'
  vars:
    _luks_regex: '^dm-uuid-CRYPT-LUKS\d-([0-9a-f]{8})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{12})-(.*)$'

- name: Write the mdadm.conf of the installed system
  when: _md_names | length > 0
  notify: Relabel sysroot
  ansible.builtin.copy:
    dest: /tuxifier-sysroot/etc/mdadm.conf
    content: |
      {% for name, uuid in _md_names | zip(_md_uuids) %}
      ARRAY /dev/md/{{ name | regex_replace('^md-name-[^:]*:', '') }} UUID={{ uuid | regex_replace('^md-uuid-', '') }}
      {% endfor %}
    mode: '0644'
