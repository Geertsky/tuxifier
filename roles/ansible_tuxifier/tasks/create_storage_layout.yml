---

- name: Make /tuxifier-sysroot a private namespace
  ansible.builtin.shell: |
    mkdir /root/namespaces
    mount --bind /root/namespaces /root/namespaces
    mount --make-private /root/namespaces
    touch /root/namespaces/tuxifier-sysroot
    unshare --mount=/root/namespaces/tuxifier-sysroot sh -c 'sleep 1'
  changed_when: false

- name: Create /tuxifier-sysroot mountpoint
  ansible.builtin.file:
    path: "/tuxifier-sysroot"
    state: directory
    mode: "0755"
  changed_when: false

- name: Activate the existing volume groups of the install layout
  community.general.lvg:
    vg: "{{ item }}"
    state: active
  loop: "{{ installdisk | selectattr('type', 'equalto', 'lvm') | map(attribute='name') | list }}"
  when:
    - not (tuxifier_reinstall | bool)
    - item in (ansible_facts['lvm']['vgs'] | default({}))

- name: Create the storage
  ansible.builtin.include_role:
    name: linux-system-roles.storage
  vars:
    storage_safe_mode: false
    storage_skip_checks:
      - blivet_available
      - packages_installed
      - cryptsetup_services
    storage_pools: "{{ installdisk }}"
    storage_volumes: []
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Read the mounts of the namespace
  ansible.builtin.slurp:
    src: /proc/self/mountinfo
  register: _mountinfo
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Set_fact sysroot mounts in creation order
  ansible.builtin.set_fact:
    _sysroot_mounts: >-
      {{ (_mountinfo.content | b64decode).splitlines()
         | map('split', ' ')
         | map(attribute=4)
         | select('match', '^/tuxifier-sysroot(/|$)')
         | list }}

- name: Umount the sysroot mounts newest first
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ _sysroot_mounts | reverse | list }}"
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell
  changed_when: false

- name: Mount the sysroot mounts parent first
  ansible.builtin.include_tasks: mount_one.yml
  loop: "{{ _sysroot_mounts | unique | sort }}"
  loop_control:
    loop_var: _mount_path
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: "Update message"
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installdisk partitioned and mounted
    mode: "0644"
  changed_when: false
