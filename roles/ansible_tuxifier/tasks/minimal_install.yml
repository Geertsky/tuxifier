---

- name: Make rpm required paths
  ansible.builtin.file:
    path: "/tuxifier-sysroot/{{ item }}"
    state: directory
  loop: >-
    {{ rpm_macros | dict2items
       | selectattr('key', 'match', '^_[a-zA-Z]+$')
       | selectattr('value', 'match', '^/[a-zA-Z/-]*$')
       | map(attribute='value') | sort }}

- name: Read rpm gpg key of distribution
  ansible.builtin.set_fact:
    distro_gpg_key: "{{ lookup('file', gpg_key) }}"

- name: Resolve install packages
  geertsky.tuxifier.generate_minimal_install_info:
    distribution: "{{ distribution }}"
  register: generate_minimal_install
  delegate_to: localhost
  vars:
    ansible_shell_executable: /bin/sh
    ansible_python_interpreter: /usr/bin/python3
  changed_when: false

- name: Import the gpg key and install the missing rpms
  geertsky.tuxifier.rpm_install:
    root: /tuxifier-sysroot
    macros: "{{ rpm_macros }}"
    gpg_keys:
      - "{{ distro_gpg_key }}"
    packages: "{{ generate_minimal_install.packages }}"
    reimport_rpmdb: "{{ rpmdb_reimport | default(false) | bool }}"
  notify: Relabel sysroot
