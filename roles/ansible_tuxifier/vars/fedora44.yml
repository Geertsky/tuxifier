---
distribution:
  name: 'fedora'
  arch: 'x86_64'
  version: '44'
  efi_vendor_dir: 'fedora'
  efi_loader: 'shimx64.efi'
  # Matches the path of the loader in a line of efibootmgr -v; the format depends on the efibootmgr version.
  efi_entry_regex: 'HD\([^)]*\)/(.*)$'
  grub_cfg: '/boot/grub2/grub.cfg'
  repo:
    type: 'metalink'
    url: 'https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch'

gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-44-primary
