---
distribution:
  name: 'fedora'
  arch: 'x86_64'
  version: '44'
  efi_vendor_dir: 'fedora'
  efi_loader: 'shimx64.efi'
  grub_cfg: '/boot/grub2/grub.cfg'
  repo:
    type: 'metalink'
    url: 'https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch'
  minimalpackages:
    - '@Core'
    - 'util-linux'
    - "{{ 'kernel-' ~ ansible_facts['kernel'] if (continue_install | default(false) | bool) else 'kernel' }}"
    - "{{ 'grub2-efi-x64' if efi_booted else 'grub2-pc' }}"
    - "{{ 'grub2-tools-efi' if efi_booted else '' }}"
    - 'lvm2'
    - 'cryptsetup'
    - 'mdadm'
    - "{{ 'shim-x64' if efi_booted else '' }}"
    - "{{ 'efibootmgr' if efi_booted else '' }}"
    - 'python3'
    - 'selinux-policy-targeted'

gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-44-primary
