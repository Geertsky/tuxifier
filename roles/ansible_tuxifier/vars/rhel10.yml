---
distribution:
  name: 'rhel'
  arch: 'x86_64'
  version: '10'
  efi_vendor_dir: 'redhat'
  efi_loader: 'shimx64.efi'
  grub_cfg: '/boot/grub2/grub.cfg'
  repo:
    type: 'mirrorlist'
    url: 'https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-10'
gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
