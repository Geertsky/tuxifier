---
distribution:
  name: 'rhel'
  arch: 'x86_64'
  version: '9'
  efi_vendor_dir: 'redhat'
  efi_loader: 'shimx64.efi'
  # Matches the path of the loader in a line of efibootmgr -v; the format depends on the efibootmgr version.
  efi_entry_regex: 'HD\([^)]*\)/File\((.*)\)'
  grub_cfg: '/boot/grub2/grub.cfg'
  # RHEL mirrors are not public: set installdistribution.repo to the BaseOS repository of your mirror.
  repo:
    type: 'baseurl'
    url: '<rhel mirror url>'

gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
