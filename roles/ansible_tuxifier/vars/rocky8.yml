---
rpmdb_reimport: True
distribution:
  name: 'rocky'
  arch: 'x86_64'
  version: '8'
  efi_vendor_dir: 'rocky'
  efi_loader: 'shimx64.efi'
  grub_cfg: '/boot/grub2/grub.cfg'
  grub_cfg_full_on_esp: true
  repo: "{{ installdistribution.repo | default({'type': 'mirrorlist', 'url': 'https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-8'}) }}"
  minimalpackages:
    - '@Core'
    - 'util-linux'
    - 'coreutils'
    - "{{ 'kernel-' ~ ansible_facts['kernel'] if (continue_install | default(false) | bool) else 'kernel' }}"
    - 'grub2-efi-x64'
    - 'grub2-tools-efi'
    - 'grub2-pc'
    - 'shim-x64'
    - 'lvm2'
    - 'efibootmgr'
    - 'sqlite'

gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-8
