---
ansible_tuxifier__distribution:
  name: 'rocky'
  arch: 'x86_64'
  version: '8'
  efi_vendor_dir: 'rocky'
  efi_loader: 'shimx64.efi'
  # Matches the path of the loader in a line of efibootmgr -v; the format depends on the efibootmgr version.
  efi_entry_regex: 'HD\([^)]*\)/File\((.*)\)'
  grub_cfg: '/boot/grub2/grub.cfg'
  grub_cfg_full_on_esp: true
  repo: "{{ ansible_tuxifier__installdistribution.repo | default({'type': 'mirrorlist', 'url': 'https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-8'}) }}"  # noqa: yaml[line-length]
  minimalpackages:
    - '@Core'
    - 'util-linux'
    - 'coreutils'
    - "{{ 'kernel-' ~ ansible_facts['kernel'] if (ansible_tuxifier__continue_install | default(false) | bool) else 'kernel' }}"
    - "{{ 'grub2-efi-x64' if ansible_tuxifier__efi_booted else 'grub2-pc' }}"
    - "{{ 'grub2-tools-efi' if ansible_tuxifier__efi_booted else '' }}"
    - "{{ 'shim-x64' if ansible_tuxifier__efi_booted else '' }}"
    - 'lvm2'
    - 'cryptsetup'
    - 'mdadm'
    - "{{ 'efibootmgr' if ansible_tuxifier__efi_booted else '' }}"
    - 'sqlite'
    # Queues the python3.12 install of the first boot, see post_minimal_install.yml.
    - 'at'

ansible_tuxifier__gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-8
