---
distribution:
  name: 'rocky'
  arch: 'x86_64'
  version: '10'
  efi_vendor_dir: 'rocky'
  efi_loader: 'shimx64.efi'
  # Matches the path of the loader in a line of efibootmgr -v; the format depends on the efibootmgr version.
  efi_entry_regex: 'HD\([^)]*\)/(.*)$'
  grub_cfg: '/boot/grub2/grub.cfg'
  repo:
    type: 'mirrorlist'
    url: 'https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-10'
gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-10
