---
rpmdb_reimport: False
distribution:
  name: 'rocky'
  arch: 'x86_64'
  version: '9'
  repo:
    repo: "{{ installdistribution.repo | default({'type': 'mirrorlist', 'url': 'https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-9'}) }}"
  minimalpackages:
    - '@Core'
    - 'util-linux'
    - "{{ 'kernel-' ~ ansible_facts['kernel'] if (continue_install | default(false) | bool) else 'kernel' }}"
    - 'grub2-efi-x64'
    - 'grub2-tools-efi'
    - 'grub2-pc'
    - 'efibootmgr'
    - 'lvm2'
    - 'shim-x64'
    - 'python3'
    - 'selinux-policy-targeted'

gpg_key: etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9
