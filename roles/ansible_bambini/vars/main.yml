ansible_interpreter_python_fallback:
  - /local/conda/envs/bambini-python/bin/python3
  - /local/conda/envs/bambini-python/bin/python
  - python3.14
  - python3.13
  - python3.12
  - python3.11
  - python3.10
  - python3.9
  - /usr/bin/python3
  - python3

rpm_argv:
  - rpm
  - --dbpath=/var/lib/rpm
  - --define
  - "_var /var"
  - --define
  - "_tmppath /var/tmp"
  - --define
  - "__urlhelpercmd /local/conda/envs/bambini-python/bin/curl"
  - --define
  - "__urlhelper_localopts --retry=10 --retry-all-errors --cacert=/etc/pki/tls/certs/ca-bundle.crt"
  - --root=/bambini-sysroot
  - --install
