---

- name: "Create message file"
  ansible.builtin.file:
    path: /tmp/message
    state: touch
    mode: "0644"

- name: "Set the install distribution vars"
  ansible.builtin.include_vars: "{{ installdistribution['name'] ~ installdistribution['version'] }}.yml"
  tags: set_dist_vars

- name: "Clear install disk"
  ansible.builtin.import_tasks: clear_disk.yml
  tags: clear_disk"

- name: "Update message"
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installdisk destroyed
    mode: "0644"

- name: Create partition tables and partitions
  ansible.builtin.include_tasks: create_partition_tables.yml

- name: Create Simple partitions
  ansible.builtin.include_tasks: create_filesystems.yml

- name: Create LVM layout
  ansible.builtin.include_tasks: create_lvm_layout.yml
  when: installdisk.lvm_layout | default([]) | length > 0

- name: Deploy ansible_shell_wrapper
  ansible.builtin.copy:
    src: namespaced-ansible-shell
    dest: /tmp/
    mode: "0755"
    owner: root
    group: root

- name: Make /bambini-sysroot a private namespace
  ansible.builtin.shell: |
    mkdir /root/namespaces
    mount --bind /root/namespaces /root/namespaces
    mount --make-private /root/namespaces
    touch /root/namespaces/bambini-sysroot
    unshare --mount=/root/namespaces/bambini-sysroot sh -c 'sleep 1'

- name: Create /bambini-sysroot mountpoint
  ansible.builtin.file:
    path: "/bambini-sysroot"
    state: directory
    mode: "0755"

- name: "Mount Partitions"
  ansible.builtin.import_tasks: mount_partitions.yml
  tags: mount_partitions
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: "Update message"
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installdisk partitioned and mounted
    mode: "0644"

- name: "Prepare chroot"
  ansible.builtin.import_tasks: prepare_chroot.yml
  tags: prepare_chroot
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: "Update message"
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installing...
    mode: "0644"

- name: "Minimal Install"
  ansible.builtin.import_tasks: minimal_install.yml
  tags: minimal_install
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: "Post Minimal Install"
  ansible.builtin.import_tasks: post_minimal_install.yml
  tags: post_minimal_install
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: "Update message"
  ansible.builtin.copy:
    dest: /tmp/message
    content: Installation finished
    mode: "0644"

- name: Umount /bambini-sysroot
  ansible.builtin.command:
    cmd: umount -R -A /bambini-sysroot
  vars:
    ansible_shell_executable: /tmp/namespaced-ansible-shell

- name: Umount /root/namespaces
  ansible.builtin.command:
    cmd: umount /root/namespaces/bambini-sysroot

- name: Umount /root/namespaces
  ansible.builtin.command:
    cmd: umount /root/namespaces

- name: "Continue install"
  ansible.builtin.import_tasks: continue_install.yml
  tags: continue_install
