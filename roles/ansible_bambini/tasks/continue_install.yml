---

- name: Poweroff
  when: not current_version_installed or not continue_install
  block:
    - name: Shutdown
      ansible.builtin.copy:
        dest: /usr/lib/dracut/hooks/pre-pivot/999-shutdown.sh
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl poweroff

    - name: "Trigger continuation of boot process"
      ansible.builtin.file:
        path: "/tmp/ansible-finished"
        state: touch
        mode: '0644'

    - name: End play
      ansible.builtin.meta: end_play


- name: Continue install
  when: continue_install and current_version_installed
  block:
    - name: "Trigger continuation of boot process"
      ansible.builtin.file:
        path: "/tmp/ansible-finished"
        state: touch
        mode: '0644'

    - name: Clear gathered facts from all currently targeted hosts
      ansible.builtin.meta: clear_facts

    - name: "Wait for bootup to finish"
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Gather facts for first time
      ansible.builtin.setup:
