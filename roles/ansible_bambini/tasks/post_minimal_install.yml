---

- name: Record installed kernel version == current kernel version
  block:
    - name: Stat vmlinuz
      ansible.builtin.stat:
        path: "{{ '/bambini-sysroot/boot/vmlinuz-' ~ ansible_facts['kernel'] }}"
      register: _vmlinuz

    - name: Set_fact current_version_installed
      ansible.builtin.set_fact:
        current_version_installed: "{{ _vmlinuz.stat.exists }}"

- name: "Set root password"
  ansible.builtin.command:
    argv:
      - chroot
      - /bambini-sysroot
      - /bin/sh
      - -c
      - "echo {{ rootpw }}|passwd --stdin root"
  register: postminimallinstall__passwd
  failed_when: postminimallinstall__passwd.rc != 0

- name: "Add root authorized_keys to chroot"
  ansible.posix.authorized_key:
    key: "{{ item }}"
    path: /bambini-sysroot/root/.ssh/authorized_keys
    user: root
  loop: "{{ root_authorized_keys }}"

- name: Detect EFI
  block:
    - name: Stat /sys/firmware/efi
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: _efi

    - name: Set_fact grub_target
      ansible.builtin.set_fact:
        grub_target: "{% if _efi.stat.exists %}x86_64-efi{% else %}i386-pc{% endif %}"

- name: Set_fact boot_disk when not in hosts_vars
  ansible.builtin.set_fact:
    boot_disk: "{{ installdisk.boot_disk | default(installdisk.disks[0].device) }}"
  when:
    - installdisk.disks | default([]) | length == 1

- name: Set_fact boot_disk when multiple disks in installdisk in hosts_vars
  ansible.builtin.set_fact:
    boot_disk: "{{ installdisk_boot_disk | default('') }}"
  when:
    - installdisk.disks | default([]) | length >= 2

- name: Validate boot_disk
  ansible.builtin.assert:
    that:
      - boot_disk | default('', true) | string | trim != ''
    fail_msg: "boot_disk in not defined. Set this in hosts_vars when there are more then one disks in installdisk."

- name: Install grub2 to boot_disk for BIOS
  when: grub_target == "i386-pc"
  ansible.builtin.command:
    cmd: "chroot /bambini-sysroot grub2-install --target=i386-pc --recheck {{ boot_disk }}"
  changed_when: true

- name: Install grub2 at efi
  when: grub_target == "x86_64-efi"
  block:
    - name: Set_fact efi partitionnr
      ansible.builtin.set_fact:
        efi_partitionnr: >-
          {{
          installdisk.disks
          | map(attribute='partitions')
          | flatten
          | selectattr('id', 'equalto', 'efi')
          | map(attribute='number')
          | first
          }}

    - name: Set_fact _efibootmgr
      ansible.builtin.set_fact:
        _efibootmgr: "{{ efibootmgr | default('/usr/sbin/efibootmgr') }}"

    - name: Read existing EFI boot entries
      ansible.builtin.command: "chroot /bambini-sysroot {{ _efibootmgr }} -v"
      register: efibootmgr_entries
      changed_when: false

    - name: Install grub2 at efi
      ansible.builtin.command: >
        chroot /bambini-sysroot {{ _efibootmgr }} --create --disk {{ boot_disk }}
        --part {{ efi_partitionnr }}
        --label {{ installdistribution.name | capitalize }}
        --loader '\EFI\{{ installdistribution.name }}\shimx64.efi'
      changed_when: false

    - name: "Install grub2 at /boot/efi/EFI/<distribution.name>/grub.cfg for RHEL8"
      when: distribution.version == "8"
      ansible.builtin.command:
        cmd: "chroot /bambini-sysroot /usr/sbin/grub2-mkconfig -o /boot/efi/EFI/{{ distribution.name }}/grub.cfg"
      register: finalize__grub2_mkconfig
      failed_when: finalize__grub2_mkconfig.rc != 0

- name: "Install grub2 /boot/grub2/grub.cfg"
  ansible.builtin.command:
    cmd: "chroot /bambini-sysroot /usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg"
  register: finalize__grub2_mkconfig
  failed_when: finalize__grub2_mkconfig.rc != 0

- name: "Discover host keys"
  ansible.builtin.find:
    path: "/etc/ssh/"
  register: etc_ssh

- name: Set_fact ssh_keys and ssh_pubs
  ansible.builtin.set_fact:
    ssh_keys: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*key$') }}"
    ssh_pubs: "{{ etc_ssh.files | map(attribute='path') | select('match', '.*pub$') }}"

- name: "Install ssh host keys"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /bambini-sysroot/etc/ssh/
    remote_src: true
    mode: '0600'
  loop: "{{ ssh_keys }}"

- name: "Install ssh host pub keys"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /bambini-sysroot/etc/ssh/
    remote_src: true
    mode: '0644'
  loop: "{{ ssh_pubs }}"
  tags: debug

- name: "Issue pre-pivot commands"
  when: distribution.pre_pivot_cmds is defined
  ansible.builtin.command: "chroot /bambini-sysroot /usr/bin/sh -c '{{ item }}'"
  loop: "{{ distribution.pre_pivot_cmds | default([]) }}"

- name: "Relabel /bambini-sysroot"
  ansible.builtin.command:
    cmd: /local/conda/envs/bambini-python/bin/chroot /bambini-sysroot /usr/sbin/fixfiles -F onboot
  when: '(strict_selinux | default(false) | bool) and not (continue_install | default(false) | bool)'
