# Plain tox (no tox-lsr). Modelled on linux-system-roles.storage.
[tox]
envlist = yamllint, ansible-lint, codespell, markdownlint, shellcheck, flake8, pylint, black, py314, ansible-test-sanity, ansible-test-units
skipsdist = true
skip_missing_interpreters = true

[testenv]
skip_install = true
passenv = HOME

[testenv:yamllint]
deps = yamllint
commands = yamllint -c .yamllint.yml {posargs:.}

[testenv:ansible-lint]
deps =
    ansible-core>=2.15
    ansible-lint
setenv =
    ANSIBLE_HOME = {envtmpdir}/ansible_home
commands =
    ansible-lint -c {toxinidir}/.ansible-lint {posargs}

[testenv:codespell]
deps = codespell
commands = codespell --config {toxinidir}/.codespellrc {posargs} {toxinidir}

[testenv:markdownlint]
allowlist_externals = npx
commands = npx --yes markdownlint-cli --config {toxinidir}/.markdownlint.yaml --ignore .tox --ignore .ansible {posargs:"**/*.md"}

[testenv:shellcheck]
deps = shellcheck-py
allowlist_externals = bash
commands = bash -c 'shellcheck {toxinidir}/scripts/*.sh {toxinidir}/tests/scripts/*.sh {toxinidir}/roles/*/files/namespaced-*'

[testenv:py{39,310,311,312,313,314}]
deps =
    ansible-core>=2.15
    -r{toxinidir}/pytest_extra_requirements.txt
commands = pytest -p no:cacheprovider {posargs:tests/unit}

[testenv:pylint]
deps =
    ansible-core>=2.15
    pylint
    pytest
commands = pylint {posargs:plugins tests/unit}

[testenv:flake8]
deps = flake8
commands = flake8 {posargs:plugins tests/unit}

[testenv:black]
deps = black
commands = black --check --diff {posargs:plugins tests/unit}

# ansible-test needs the collection below ansible_collections/<namespace>/<name>.
# Stage a copy of the checkout there and run from inside it.
[testenv:ansible-test-{sanity,units}]
deps =
    ansible-core>=2.15
    -r{toxinidir}/pytest_extra_requirements.txt
allowlist_externals =
    bash
    rsync
setenv =
    COLLECTION_DIR = {envtmpdir}/ansible_collections/geertsky/tuxifier
commands_pre =
    bash -c 'rm -rf "{envtmpdir}/ansible_collections" && mkdir -p "$COLLECTION_DIR" && rsync -a --exclude=.tox --exclude=.git --exclude=.ansible --exclude=__pycache__ --exclude=.pytest_cache --exclude=scripts {toxinidir}/ "$COLLECTION_DIR"/ && cd "$COLLECTION_DIR" && git init -q && git add -A'
commands =
    sanity: bash -c 'cd "$COLLECTION_DIR" && ansible-test sanity --local --color --python {env:ANSIBLE_TEST_PYTHON:3.14} {posargs}'
    units: bash -c 'cd "$COLLECTION_DIR" && ansible-test units --local --color --python {env:ANSIBLE_TEST_PYTHON:3.14} {posargs}'

# Install a distribution of the role (rocky, rhel, almalinux or fedora) with the role, in a throwaway qemu VM that direct-kernel-boots the incubator initramfs
# of the sysimage ~/work/tuxifier/rocky<N> (created by tests/scripts/sysimage.sh if missing, needs sudo for dnf and
# dracut). Needs KVM, qemu-img and network access; not in the default envlist. The steps:
#   1. boot the initramfs and run the role with tuxifier_reinstall=true; the VM powers off when it is done
#   2. boot the initramfs again on the same disk and run the role with tuxifier_reinstall=false
#   3. add enforcing=0 to the boot entries of the disk (sudo), boot the installed system from it and check it
# The last factor is the layout of the install target: lvm, parts (no LVM), luks, raid (md RAID1, needs two extra disks) or
# raidluks, or cryptroot (encrypted /, boot-disk types the passphrase at the serial console). The factor continue runs the role with continue_install=true: after each run the initramfs continues its boot into the
# installed system, which is checked; it is powered off between the two runs. The factor poweroff is the flow above.
# The initramfs always comes from a rocky sysimage (QEMU_INITRAMFS, default: rocky<major> and rocky10 for fedora).
# QEMU_REPO_URL=<baseurl of BaseOS> installs from a nearby mirror, for example http://192.168.122.1/rocky/9/BaseOS/x86_64/os/.
# The URL has to work on the controller too: the package list is resolved there. Without it the mirrorlist of the role is used.
[qemu]
deps = ansible-core>=2.15
passenv =
    QEMU_REPO_URL
    QEMU_MIRROR
    QEMU_INITRAMFS
    QEMU_KEEP_DISK
    QEMU_OVMF_CODE
    QEMU_OVMF_VARS
    SYSIMAGE_DIR
    TUXIFIER_TEST_DIR
    DRACUT_INCUBATOR
    DRACUT_SSHD
allowlist_externals =
    ansible-galaxy
    bash
commands_pre =
    ansible-galaxy collection install {toxinidir} --force -p {envtmpdir}/collections
    ansible-galaxy role install -r {toxinidir}/requirements.yml -p {envtmpdir}/roles --force
commands_post =
    bash {toxinidir}/tests/scripts/qemu-vm.sh stop

[testenv:qemu-{rocky8,rocky9,rocky10,rhel8,rhel9,rhel10,almalinux9,almalinux10,fedora38,fedora44}-{bios,uefi}-{poweroff,continue}-{lvm,parts,luks,raid,raidluks,cryptroot}]
deps = {[qemu]deps}
passenv = {[qemu]passenv}
allowlist_externals = {[qemu]allowlist_externals}
setenv =
    ANSIBLE_HOME = {envtmpdir}/ansible_home
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/collections
    ANSIBLE_ROLES_PATH = {envtmpdir}/roles
    ANSIBLE_HOST_KEY_CHECKING = false
    ANSIBLE_TIMEOUT = 60
    QEMU_WORKDIR = {envtmpdir}/qemu
    rocky8: QEMU_DISTRO = rocky8
    rocky9: QEMU_DISTRO = rocky9
    rocky10: QEMU_DISTRO = rocky10
    rhel8: QEMU_DISTRO = rhel8
    rhel9: QEMU_DISTRO = rhel9
    rhel10: QEMU_DISTRO = rhel10
    almalinux9: QEMU_DISTRO = almalinux9
    almalinux10: QEMU_DISTRO = almalinux10
    fedora38: QEMU_DISTRO = fedora38
    fedora44: QEMU_DISTRO = fedora44
    bios: QEMU_FIRMWARE = bios
    uefi: QEMU_FIRMWARE = uefi
    lvm: QEMU_LAYOUT = lvm
    parts: QEMU_LAYOUT = parts
    luks: QEMU_LAYOUT = luks
    raid: QEMU_LAYOUT = raid
    raid: QEMU_EXTRA_DISKS = 2
    raidluks: QEMU_LAYOUT = raidluks
    raidluks: QEMU_EXTRA_DISKS = 2
    cryptroot: QEMU_LAYOUT = cryptroot
    cryptroot: QEMU_LUKS_PASSPHRASE = luks-passphrase
commands_pre = {[qemu]commands_pre}
commands =
    bash {toxinidir}/tests/scripts/qemu-vm.sh start
    poweroff: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true -e continue_install=false {posargs}
    poweroff: bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    poweroff: bash {toxinidir}/tests/scripts/qemu-vm.sh restart
    poweroff: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=false -e continue_install=false {posargs}
    poweroff: bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    poweroff: bash {toxinidir}/tests/scripts/qemu-vm.sh permissive-first-boot
    poweroff: bash {toxinidir}/tests/scripts/qemu-vm.sh boot-disk
    poweroff: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml {posargs}
    continue: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true -e continue_install=true {posargs}
    continue: bash {toxinidir}/tests/scripts/qemu-vm.sh wait-installed
    continue: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml {posargs}
    continue: bash {toxinidir}/tests/scripts/qemu-vm.sh poweroff-installed
    continue: bash {toxinidir}/tests/scripts/qemu-vm.sh restart
    continue: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=false -e continue_install=true {posargs}
    continue: bash {toxinidir}/tests/scripts/qemu-vm.sh wait-installed
    continue: ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml {posargs}
commands_post = {[qemu]commands_post}

# T-c: root_authorized_keys and rootpw. The role gets a second public key; the installed system has it in authorized_keys, accepts
# a login with it, and the root password is the one of rootpw.
[testenv:qemu-{rocky8,rocky9,rocky10,rhel8,rhel9,rhel10,almalinux9,almalinux10,fedora38,fedora44}-{bios,uefi}-keys]
deps = {[qemu]deps}
passenv = {[qemu]passenv}
allowlist_externals = {[qemu]allowlist_externals}
setenv =
    ANSIBLE_HOME = {envtmpdir}/ansible_home
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/collections
    ANSIBLE_ROLES_PATH = {envtmpdir}/roles
    ANSIBLE_HOST_KEY_CHECKING = false
    ANSIBLE_TIMEOUT = 60
    QEMU_WORKDIR = {envtmpdir}/qemu
    rocky8: QEMU_DISTRO = rocky8
    rocky9: QEMU_DISTRO = rocky9
    rocky10: QEMU_DISTRO = rocky10
    rhel8: QEMU_DISTRO = rhel8
    rhel9: QEMU_DISTRO = rhel9
    rhel10: QEMU_DISTRO = rhel10
    almalinux9: QEMU_DISTRO = almalinux9
    almalinux10: QEMU_DISTRO = almalinux10
    fedora38: QEMU_DISTRO = fedora38
    fedora44: QEMU_DISTRO = fedora44
    bios: QEMU_FIRMWARE = bios
    uefi: QEMU_FIRMWARE = uefi
    QEMU_LAYOUT = lvm
    QEMU_EXTRA_KEY = 1
commands_pre = {[qemu]commands_pre}
commands =
    bash {toxinidir}/tests/scripts/qemu-vm.sh start
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true {posargs}
    bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    bash {toxinidir}/tests/scripts/qemu-vm.sh permissive-first-boot
    bash {toxinidir}/tests/scripts/qemu-vm.sh boot-disk
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml {posargs}
    ansible-playbook -i {envtmpdir}/qemu/inventory-extrakey.ini {toxinidir}/tests/tests_installed.yml {posargs}
commands_post = {[qemu]commands_post}

# T-d: strict_selinux. Without it the files that the role writes are unlabeled at the first boot; with it the first boot relabels the
# system. The same disk is installed twice (tuxifier_reinstall=true), first without and then with strict_selinux.
[testenv:qemu-{rocky8,rocky9,rocky10,rhel8,rhel9,rhel10,almalinux9,almalinux10,fedora38,fedora44}-{bios,uefi}-selinux]
deps = {[qemu]deps}
passenv = {[qemu]passenv}
allowlist_externals = {[qemu]allowlist_externals}
setenv =
    ANSIBLE_HOME = {envtmpdir}/ansible_home
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/collections
    ANSIBLE_ROLES_PATH = {envtmpdir}/roles
    ANSIBLE_HOST_KEY_CHECKING = false
    ANSIBLE_TIMEOUT = 60
    QEMU_WORKDIR = {envtmpdir}/qemu
    rocky8: QEMU_DISTRO = rocky8
    rocky9: QEMU_DISTRO = rocky9
    rocky10: QEMU_DISTRO = rocky10
    rhel8: QEMU_DISTRO = rhel8
    rhel9: QEMU_DISTRO = rhel9
    rhel10: QEMU_DISTRO = rhel10
    almalinux9: QEMU_DISTRO = almalinux9
    almalinux10: QEMU_DISTRO = almalinux10
    fedora38: QEMU_DISTRO = fedora38
    fedora44: QEMU_DISTRO = fedora44
    bios: QEMU_FIRMWARE = bios
    uefi: QEMU_FIRMWARE = uefi
    QEMU_LAYOUT = lvm
commands_pre = {[qemu]commands_pre}
commands =
    bash {toxinidir}/tests/scripts/qemu-vm.sh start
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true -e strict_selinux=false {posargs}
    bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    bash {toxinidir}/tests/scripts/qemu-vm.sh permissive-first-boot
    bash {toxinidir}/tests/scripts/qemu-vm.sh boot-disk
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml -e __test_expect_labeled=false {posargs}
    bash {toxinidir}/tests/scripts/qemu-vm.sh poweroff-installed
    bash {toxinidir}/tests/scripts/qemu-vm.sh restart
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true -e strict_selinux=true {posargs}
    bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    bash {toxinidir}/tests/scripts/qemu-vm.sh permissive-first-boot
    bash {toxinidir}/tests/scripts/qemu-vm.sh boot-disk
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml -e __test_expect_labeled=true {posargs}
commands_post = {[qemu]commands_post}

# T-b: distribution change. The disk is installed with the distribution of the factor, then, with tuxifier_reinstall=true, with another one
# (rocky8 to rhel8, rocky9 to almalinux9, rocky10 to almalinux10, see change_target_distro in common.sh); the installed system is the second one.
[testenv:qemu-{rocky8,rocky9,rocky10}-{bios,uefi}-distchange]
deps = {[qemu]deps}
passenv = {[qemu]passenv}
allowlist_externals = {[qemu]allowlist_externals}
setenv =
    ANSIBLE_HOME = {envtmpdir}/ansible_home
    ANSIBLE_COLLECTIONS_PATH = {envtmpdir}/collections
    ANSIBLE_ROLES_PATH = {envtmpdir}/roles
    ANSIBLE_HOST_KEY_CHECKING = false
    ANSIBLE_TIMEOUT = 60
    QEMU_WORKDIR = {envtmpdir}/qemu
    rocky8: QEMU_DISTRO = rocky8
    rocky9: QEMU_DISTRO = rocky9
    rocky10: QEMU_DISTRO = rocky10
    rhel8: QEMU_DISTRO = rhel8
    rhel9: QEMU_DISTRO = rhel9
    rhel10: QEMU_DISTRO = rhel10
    almalinux9: QEMU_DISTRO = almalinux9
    almalinux10: QEMU_DISTRO = almalinux10
    fedora38: QEMU_DISTRO = fedora38
    fedora44: QEMU_DISTRO = fedora44
    bios: QEMU_FIRMWARE = bios
    uefi: QEMU_FIRMWARE = uefi
    QEMU_LAYOUT = lvm
commands_pre = {[qemu]commands_pre}
commands =
    bash {toxinidir}/tests/scripts/qemu-vm.sh start
    ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true {posargs}
    bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    bash {toxinidir}/tests/scripts/qemu-vm.sh restart
    bash -c 'ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_install.yml -e tuxifier_reinstall=true '"$(bash {toxinidir}/tests/scripts/qemu-vm.sh change-vars)"' {posargs}'
    bash {toxinidir}/tests/scripts/qemu-vm.sh wait-poweroff
    bash {toxinidir}/tests/scripts/qemu-vm.sh permissive-first-boot
    bash {toxinidir}/tests/scripts/qemu-vm.sh boot-disk
    bash -c 'ansible-playbook -i {envtmpdir}/qemu/inventory.ini {toxinidir}/tests/tests_installed.yml '"$(bash {toxinidir}/tests/scripts/qemu-vm.sh change-vars)"' {posargs}'
commands_post = {[qemu]commands_post}
