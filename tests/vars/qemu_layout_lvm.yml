---
# L1: /dev/vda has a physical volume with the volume group vg.test, that holds swap and /.
installdisk:
  - name: /dev/vda
    type: partition
    disks: [/dev/vda]
    volumes: "{{ __test_boot_volumes + [{'name': '3', 'size': '0', 'fs_type': 'lvmpv'}] }}"
  - name: vg.test
    type: lvm
    disks: [/dev/vda3]
    volumes:
      - name: swap
        size: 512M
        fs_type: swap
        fs_label: swap
      - name: root
        size: 5GiB
        fs_type: "{{ __test_fs_type }}"
        fs_label: root
        fs_create_options: "-O ^orphan_file"
        mount_point: /

__test_mounts: "{{ __test_boot_mounts + [{'target': '/', 'source': '/dev/mapper/vg.test-root', 'fstype': __test_fs_type}] }}"
__test_lvs: [vg.test-root, vg.test-swap]
__test_luks_devices: []
__test_raid: false
