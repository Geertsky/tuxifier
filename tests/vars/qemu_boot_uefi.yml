---
# The first partitions of /dev/vda on UEFI: /boot and the ESP. The layouts continue with partition 3.
# The ext4 of python-nest has the orphan_file feature, that the e2fsck of the distributions does not know yet.
__test_boot_volumes:
  - name: "1"
    size: 1GiB
    fs_type: "{{ __test_fs_type }}"
    fs_label: boot
    fs_create_options: "-O ^orphan_file"
    mount_point: /boot
  - name: "2"
    size: 512MiB
    fs_type: efi
    fs_label: EFI
    mount_point: /boot/efi
    mount_options: "umask=0077,shortname=winnt"
__test_boot_mounts:
  - {target: /boot, source: /dev/vda1, fstype: "{{ __test_fs_type }}"}
  - {target: /boot/efi, source: /dev/vda2, fstype: vfat}
__test_boot_device: /dev/vda1
