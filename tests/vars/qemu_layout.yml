---
# Storage layout of the install target /dev/vda: biosboot, /boot and an lvm physical volume with swap and /.
# The ext4 of python-nest has the orphan_file feature, that the e2fsck of the distributions does not know yet.
installdisk:
  - name: /dev/vda
    type: partition
    disks: [/dev/vda]
    volumes:
      - name: "1"
        size: 1MiB
        fs_type: biosboot
      - name: "2"
        size: 1022MiB
        fs_type: "{{ __test_fs_type }}"
        fs_label: boot
        fs_create_options: "-O ^orphan_file"
        mount_point: /boot
      - name: "3"
        size: "0"
        fs_type: lvmpv
  - name: vg.test
    type: lvm
    disks: [/dev/vda3]
    volumes:
      - name: swap
        size: 512M
        fs_type: swap
        fs_label: swap
      - name: root
        size: 5GiB
        fs_type: "{{ __test_fs_type }}"
        fs_label: root
        fs_create_options: "-O ^orphan_file"
        mount_point: /
