---
# ansible_tuxifier__continue_install needs the kernel of the initramfs in the installed system. When the repository of the distribution does not
# have it, here because the initramfs of another major version is booted (see the tox envs qemu-<distro>-<fw>-kernelmismatch),
# the role stops at the resolution of the packages and names the kernel.
- name: Do not continue_install with a kernel that is not in the repository
  hosts: installer
  gather_facts: false
  vars_files:
    - vars/qemu_rocky.yml
    - "vars/qemu_boot_{{ lookup('ansible.builtin.env', 'QEMU_FIRMWARE') | default('bios', true) }}.yml"
    - "vars/qemu_layout_{{ lookup('ansible.builtin.env', 'QEMU_LAYOUT') | default('lvm', true) }}.yml"
  environment: "{{ __test_python_nest_environment }}"
  tasks:
    - name: Run the role with ansible_tuxifier__continue_install
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: geertsky.tuxifier.ansible_tuxifier
          vars:
            ansible_tuxifier__continue_install: true
        - name: The role did not fail
          ansible.builtin.set_fact: {__test_failed_task: "", __test_failed_msg: ""}
      rescue:
        - name: Keep the failure
          ansible.builtin.set_fact:
            __test_failed_task: "{{ ansible_failed_task.name }}"
            __test_failed_msg: "{{ (ansible_failed_result.msg | default('') | string) ~ ' ' ~ (ansible_failed_result.message | default('') | string) }}"

    - name: Check the failure
      ansible.builtin.include_tasks: tasks/check_failure.yml
      vars:
        __test_expect_task: Resolve install packages
        __test_expect_msg: kernel
