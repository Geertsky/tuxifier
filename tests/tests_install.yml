---
# Run the role on a VM that booted the incubator initramfs of QEMU_DISTRO (see tox env qemu-rocky<N> and
# tests/scripts/qemu-vm.sh). The install target is /dev/vda. The role installs the distribution and, as
# continue_install is false, the VM powers off. tox runs this playbook twice, with tuxifier_reinstall true and false.
- name: Role ansible_tuxifier in the incubator initramfs
  hosts: installer
  gather_facts: false
  vars_files:
    - vars/qemu_rocky.yml
    - "vars/qemu_boot_{{ lookup('ansible.builtin.env', 'QEMU_FIRMWARE') | default('bios', true) }}.yml"
    - "vars/qemu_layout_{{ lookup('ansible.builtin.env', 'QEMU_LAYOUT') | default('lvm', true) }}.yml"
  tasks:
    - name: Install the distribution
      ansible.builtin.include_tasks: tasks/run_role.yml
