---
# The second test key is in authorized_keys of root and the root password is ansible_tuxifier__rootpw. That the installed system accepts a
# login with the key is checked by running the play with the inventory that has it (inventory-extrakey.ini of qemu-vm.sh).
- name: Read the authorized keys of root
  ansible.builtin.raw: cat /root/.ssh/authorized_keys
  register: __test_authorized_keys
  changed_when: false

- name: Read the password hash of root
  ansible.builtin.raw: "awk -F: '$1 == \"root\" {print $2}' /etc/shadow"
  register: __test_root_hash
  changed_when: false

# chpasswd makes sha512 ($6$) or yescrypt ($y$), depending on the distribution. sha512 is made again on the controller
# with the salt of the installed hash; for the others the installed system hashes ansible_tuxifier__rootpw with its own libcrypt.
- name: Make the hash of ansible_tuxifier__rootpw with the salt of the installed system
  when: __test_hash_id == '6'
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ __test_hash.split('$')[2] }}", "{{ ansible_tuxifier__rootpw }}"]
  delegate_to: localhost
  register: __test_expected_hash
  changed_when: false
  vars:
    __test_hash: "{{ __test_root_hash.stdout_lines[0] | trim }}"
    __test_hash_id: "{{ __test_hash.split('$')[1] }}"

- name: Check the hash of ansible_tuxifier__rootpw with the libcrypt of the installed system
  when: __test_hash_id != '6'
  ansible.builtin.raw: >-
    for p in python3 /usr/libexec/platform-python; do command -v $p > /dev/null && exec $p -c
    "import crypt, sys; print(crypt.crypt(sys.argv[1], sys.argv[2]) == sys.argv[2])" '{{ ansible_tuxifier__rootpw }}' '{{ __test_hash }}' 2> /dev/null; done
  register: __test_crypt_check
  changed_when: false
  vars:
    __test_hash: "{{ __test_root_hash.stdout_lines[0] | trim }}"
    __test_hash_id: "{{ __test_hash.split('$')[1] }}"

- name: Check the keys and the root password
  vars:
    __test_hash: "{{ __test_root_hash.stdout_lines[0] | trim }}"
    __test_hash_id: "{{ __test_hash.split('$')[1] }}"
    __test_key_blob: "{{ (lookup('ansible.builtin.file', __test_extra_key_pub) | trim).split()[1] }}"
  ansible.builtin.assert:
    that:
      - __test_key_blob in __test_authorized_keys.stdout
      - >-
        (__test_hash_id == '6' and __test_expected_hash.stdout | trim == __test_hash) or
        (__test_hash_id != '6' and __test_crypt_check.stdout_lines | last | trim == 'True')
    fail_msg: "The root password is not ansible_tuxifier__rootpw (hash type {{ __test_hash_id }}), or the key is missing"
